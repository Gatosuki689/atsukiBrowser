<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<title>AtsukiNotes</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --accent:   #7c3aed;
  --bg:       #0d0d14;
  --surface:  #13131f;
  --surface2: #1a1a2e;
  --border:   rgba(124,58,237,0.2);
  --text:     rgba(255,255,255,0.85);
  --muted:    rgba(255,255,255,0.35);
  --accent-r: 124; --accent-g: 58; --accent-b: 237;
}

body {
  font-family: 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── TOPBAR ── */
#topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#btn-back {
  background: none; border: none; color: var(--muted);
  font-size: 18px; cursor: pointer; padding: 4px 8px;
  border-radius: 6px; transition: color 0.15s, background 0.15s;
}
#btn-back:hover { color: var(--text); background: rgba(255,255,255,0.06); }
#app-title { font-size: 16px; font-weight: 300; color: white; letter-spacing: 0.05em; }
#app-title span { color: var(--accent); }

#search-wrap {
  flex: 1; max-width: 400px; margin-left: 8px;
  position: relative;
}
#search {
  width: 100%; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); font-size: 13px;
  padding: 7px 12px 7px 34px;
  outline: none; transition: border-color 0.2s;
  font-family: inherit;
}
#search:focus { border-color: rgba(var(--accent-r),var(--accent-g),var(--accent-b),0.5); }
#search-icon {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  font-size: 14px; color: var(--muted); pointer-events: none;
}
#search::placeholder { color: var(--muted); }

.topbar-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }

.view-btn {
  background: none; border: 1px solid transparent;
  color: var(--muted); padding: 5px 8px; border-radius: 6px;
  cursor: pointer; font-size: 15px; transition: all 0.15s;
}
.view-btn:hover { color: var(--text); background: rgba(255,255,255,0.06); }
.view-btn.active { color: var(--accent); border-color: var(--border); }

/* ── BODY ── */
#body {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── SIDEBAR ETIQUETAS ── */
#sidebar {
  width: 200px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 12px 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow-y: auto;
}
.sidebar-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 8px;
  cursor: pointer; font-size: 13px; color: var(--muted);
  transition: all 0.15s; user-select: none;
}
.sidebar-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
.sidebar-item.active { background: rgba(var(--accent-r),var(--accent-g),var(--accent-b),0.12); color: var(--accent); }
.sidebar-item .si-icon { font-size: 15px; width: 20px; text-align: center; }
.sidebar-sep { height: 1px; background: var(--border); margin: 8px 4px; }

.tag-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

#btn-nueva-etiqueta {
  margin-top: auto; display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 8px; cursor: pointer;
  font-size: 12px; color: var(--muted);
  background: none; border: 1px dashed rgba(255,255,255,0.1);
  transition: all 0.15s; font-family: inherit; width: 100%;
}
#btn-nueva-etiqueta:hover { border-color: var(--accent); color: var(--accent); }

/* ── MAIN ── */
#main {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

/* ── CREAR NOTA ── */
#crear-nota {
  max-width: 560px; margin: 0 auto 28px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: box-shadow 0.2s;
}
#crear-nota:focus-within {
  box-shadow: 0 0 0 2px rgba(var(--accent-r),var(--accent-g),var(--accent-b),0.3);
  border-color: rgba(var(--accent-r),var(--accent-g),var(--accent-b),0.4);
}
#crear-titulo {
  width: 100%; background: none; border: none;
  border-bottom: 1px solid transparent;
  color: var(--text); font-size: 14px; font-weight: 500;
  padding: 12px 16px 8px;
  outline: none; font-family: inherit;
  display: none;
}
#crear-titulo.visible {
  display: block;
  border-bottom-color: var(--border);
}
#crear-titulo::placeholder { color: var(--muted); }
#crear-contenido {
  width: 100%; background: none; border: none;
  color: var(--text); font-size: 13px;
  padding: 12px 16px; min-height: 44px;
  outline: none; resize: none; font-family: inherit;
  line-height: 1.5;
}
#crear-contenido::placeholder { color: var(--muted); }
#crear-footer {
  display: none; padding: 8px 12px;
  align-items: center; gap: 6px;
  border-top: 1px solid var(--border);
}
#crear-footer.visible { display: flex; }

.crear-color-btn {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid transparent; cursor: pointer;
  transition: transform 0.15s; flex-shrink: 0;
}
.crear-color-btn:hover { transform: scale(1.2); }
.crear-color-btn.selected { border-color: white; }

#crear-pin {
  background: none; border: none; color: var(--muted);
  font-size: 14px; cursor: pointer; padding: 4px;
  border-radius: 4px; transition: color 0.15s;
  margin-left: 4px;
}
#crear-pin:hover, #crear-pin.on { color: var(--accent); }

#btn-crear {
  margin-left: auto; background: rgba(var(--accent-r),var(--accent-g),var(--accent-b),0.15);
  border: 1px solid var(--border); color: var(--accent);
  padding: 5px 14px; border-radius: 6px; cursor: pointer;
  font-size: 12px; font-family: inherit; transition: background 0.15s;
}
#btn-crear:hover { background: rgba(var(--accent-r),var(--accent-g),var(--accent-b),0.25); }

/* ── SECCIÓN PINNED ── */
.section-label {
  font-size: 10px; color: var(--muted); text-transform: uppercase;
  letter-spacing: 0.12em; margin-bottom: 12px; padding-left: 2px;
}

/* ── GRID DE NOTAS ── */
#notas-wrap { max-width: 1200px; margin: 0 auto; }

.notas-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}
.notas-grid.lista {
  grid-template-columns: 1fr;
  max-width: 560px;
}

/* ── TARJETA NOTA ── */
.nota-card {
  border-radius: 10px;
  border: 1px solid var(--border);
  padding: 14px 16px 10px;
  position: relative;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
  display: flex; flex-direction: column; gap: 6px;
  min-height: 80px;
}
.nota-card:hover {
  border-color: rgba(var(--accent-r),var(--accent-g),var(--accent-b),0.4);
  transform: translateY(-1px);
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.nota-card .nota-pin {
  position: absolute; top: 8px; right: 10px;
  font-size: 13px; opacity: 0; transition: opacity 0.15s;
  color: var(--accent);
}
.nota-card.pinned .nota-pin { opacity: 1; }
.nota-card:hover .nota-pin { opacity: 0.6; }
.nota-card.pinned:hover .nota-pin { opacity: 1; }

.nota-titulo {
  font-size: 14px; font-weight: 500; color: white;
  line-height: 1.3; word-break: break-word;
}
.nota-contenido {
  font-size: 12px; color: var(--muted);
  line-height: 1.5; word-break: break-word;
  white-space: pre-wrap;
  display: -webkit-box; -webkit-line-clamp: 6;
  -webkit-box-orient: vertical; overflow: hidden;
}

.nota-footer {
  display: flex; align-items: center; gap: 6px;
  margin-top: 4px; opacity: 0; transition: opacity 0.15s;
}
.nota-card:hover .nota-footer { opacity: 1; }

.nota-tag {
  font-size: 9px; padding: 2px 7px; border-radius: 20px;
  text-transform: uppercase; letter-spacing: 0.06em;
  border: 1px solid;
}
.nota-fecha { font-size: 10px; color: var(--muted); margin-left: auto; }

.nota-actions {
  display: flex; gap: 2px; margin-left: auto;
}
.nota-action-btn {
  background: none; border: none; color: var(--muted);
  font-size: 13px; cursor: pointer; padding: 3px 5px;
  border-radius: 4px; transition: color 0.15s, background 0.15s;
}
.nota-action-btn:hover { color: var(--text); background: rgba(255,255,255,0.08); }
.nota-action-btn.danger:hover { color: #ef4444; }

/* ── MODAL EDITAR ── */
#modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
  z-index: 100; align-items: center; justify-content: center;
}
#modal-overlay.open { display: flex; }
#modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  width: 520px; max-width: 90vw; max-height: 80vh;
  display: flex; flex-direction: column;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  animation: modalIn 0.18s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.95) translateY(10px); }
  to   { opacity: 1; transform: scale(1)    translateY(0); }
}
#modal-titulo {
  background: none; border: none; border-bottom: 1px solid var(--border);
  color: white; font-size: 15px; font-weight: 500;
  padding: 16px 20px; outline: none; font-family: inherit;
  width: 100%; border-radius: 14px 14px 0 0;
}
#modal-titulo::placeholder { color: var(--muted); }
#modal-contenido {
  flex: 1; background: none; border: none;
  color: var(--text); font-size: 13px;
  padding: 14px 20px; outline: none; resize: none;
  font-family: inherit; line-height: 1.6;
  min-height: 180px; overflow-y: auto;
}
#modal-contenido::placeholder { color: var(--muted); }
#modal-footer {
  padding: 10px 16px; border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
  flex-wrap: wrap;
}
#modal-colores { display: flex; gap: 6px; }
.modal-color-btn {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid transparent; cursor: pointer; transition: transform 0.15s;
}
.modal-color-btn:hover { transform: scale(1.2); }
.modal-color-btn.selected { border-color: white; }

#modal-pin {
  background: none; border: none; color: var(--muted);
  font-size: 14px; cursor: pointer; padding: 4px 6px;
  border-radius: 4px; transition: color 0.15s;
}
#modal-pin.on { color: var(--accent); }

#modal-etiqueta {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); font-size: 12px; padding: 4px 10px;
  border-radius: 6px; outline: none; font-family: inherit;
  cursor: pointer;
}
#modal-etiqueta option { background: var(--surface2); }

#modal-guardar {
  margin-left: auto;
  background: rgba(var(--accent-r),var(--accent-g),var(--accent-b),0.15);
  border: 1px solid var(--border); color: var(--accent);
  padding: 6px 16px; border-radius: 6px; cursor: pointer;
  font-size: 12px; font-family: inherit; transition: background 0.15s;
}
#modal-guardar:hover { background: rgba(var(--accent-r),var(--accent-g),var(--accent-b),0.28); }

/* ── EMPTY STATE ── */
#empty {
  text-align: center; padding: 60px 20px;
  color: var(--muted); font-size: 14px;
  display: none;
}
#empty .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>

<!-- TOPBAR -->
<div id="topbar">
  <button id="btn-back">←</button>
  <div id="app-title">Atsuki<span>Notes</span></div>
  <div id="search-wrap">
    <span id="search-icon">🔍</span>
    <input id="search" type="text" placeholder="Buscar notas..."/>
  </div>
  <div class="topbar-right">
    <button class="view-btn active" id="btn-grid" title="Cuadrícula">⊞</button>
    <button class="view-btn" id="btn-lista" title="Lista">☰</button>
  </div>
</div>

<!-- BODY -->
<div id="body">

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="sidebar-item active" data-filtro="todas">
      <span class="si-icon">📋</span> Todas
    </div>
    <div class="sidebar-item" data-filtro="pinned">
      <span class="si-icon">📌</span> Fijadas
    </div>
    <div class="sidebar-item" data-filtro="archivadas">
      <span class="si-icon">📦</span> Archivadas
    </div>
    <div class="sidebar-sep"></div>
    <div id="etiquetas-sidebar"></div>
    <button id="btn-nueva-etiqueta">+ Nueva etiqueta</button>
  </div>

  <!-- MAIN -->
  <div id="main">
    <div id="notas-wrap">

      <!-- CREAR NOTA -->
      <div id="crear-nota">
        <input id="crear-titulo" type="text" placeholder="Título"/>
        <textarea id="crear-contenido" rows="1" placeholder="Crear una nota..."></textarea>
        <div id="crear-footer">
          <div id="crear-colores"></div>
          <button id="crear-pin" title="Fijar">📌</button>
          <button id="btn-crear">Guardar</button>
        </div>
      </div>

      <!-- NOTAS PINNED -->
      <div id="seccion-pinned" style="display:none">
        <div class="section-label">Fijadas</div>
        <div class="notas-grid" id="grid-pinned"></div>
        <div class="section-label" style="margin-top:8px">Otras</div>
      </div>

      <!-- NOTAS NORMALES -->
      <div class="notas-grid" id="grid-notas"></div>

      <!-- EMPTY -->
      <div id="empty">
        <div class="empty-icon">🗒️</div>
        Las notas que añadas aparecerán aquí
      </div>
    </div>
  </div>
</div>

<!-- MODAL EDITAR -->
<div id="modal-overlay">
  <div id="modal">
    <input id="modal-titulo" type="text" placeholder="Título"/>
    <textarea id="modal-contenido" placeholder="Nota..."></textarea>
    <div id="modal-footer">
      <div id="modal-colores"></div>
      <button id="modal-pin" title="Fijar">📌</button>
      <select id="modal-etiqueta">
        <option value="">Sin etiqueta</option>
      </select>
      <button id="modal-guardar">Guardar</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════
//  ESTADO
// ═══════════════════════════════════
let notas = [];
let etiquetas = [];
let filtroActivo = 'todas';
let modoVista = 'grid';
let editandoId = null;
let crearPinOn = false;
let crearColorIdx = 0;
let modalPinOn = false;
let modalColorIdx = 0;

const COLORES = [
  { nombre: 'default', bg: 'transparent',       border: 'rgba(124,58,237,0.2)' },
  { nombre: 'violeta', bg: 'rgba(124,58,237,0.12)', border: 'rgba(124,58,237,0.35)' },
  { nombre: 'azul',    bg: 'rgba(59,130,246,0.12)', border: 'rgba(59,130,246,0.35)' },
  { nombre: 'verde',   bg: 'rgba(16,185,129,0.12)', border: 'rgba(16,185,129,0.35)' },
  { nombre: 'amarillo',bg: 'rgba(245,158,11,0.12)', border: 'rgba(245,158,11,0.35)' },
  { nombre: 'rojo',    bg: 'rgba(239,68,68,0.12)',  border: 'rgba(239,68,68,0.35)' },
  { nombre: 'rosa',    bg: 'rgba(236,72,153,0.12)', border: 'rgba(236,72,153,0.35)' },
];

const COLOR_DOTS = [
  '#888', '#7c3aed', '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#ec4899'
];

// ═══════════════════════════════════
//  PERSISTENCIA
// ═══════════════════════════════════
function guardarLocal() {
  try {
    const data = JSON.stringify({ notas, etiquetas });
    // Mandar en chunks de 512KB para evitar límite de WebView2
    const CHUNK = 512 * 1024;
    if (data.length <= CHUNK) {
      window.chrome.webview.postMessage('notes:guardar:' + data);
    } else {
      const total = Math.ceil(data.length / CHUNK);
      for (let i = 0; i < total; i++) {
        const chunk = data.slice(i * CHUNK, (i + 1) * CHUNK);
        window.chrome.webview.postMessage(`notes:chunk:${i}:${total}:${chunk}`);
      }
    }
  } catch(e) { console.error('Error guardando:', e); }
}

// ═══════════════════════════════════
//  RENDER COLORES
// ═══════════════════════════════════
function renderColores(containerId, selectedIdx, onSelect) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  COLOR_DOTS.forEach((color, i) => {
    const btn = document.createElement('div');
    btn.className = 'crear-color-btn' + (i === selectedIdx ? ' selected' : '');
    btn.style.background = color;
    btn.title = COLORES[i].nombre;
    btn.onclick = (e) => { e.stopPropagation(); onSelect(i); };
    el.appendChild(btn);
  });
}

// ═══════════════════════════════════
//  RENDER SIDEBAR ETIQUETAS
// ═══════════════════════════════════
function renderSidebar() {
  const el = document.getElementById('etiquetas-sidebar');
  el.innerHTML = '';
  etiquetas.forEach(tag => {
    const item = document.createElement('div');
    item.className = 'sidebar-item' + (filtroActivo === 'tag:' + tag.id ? ' active' : '');
    item.dataset.filtro = 'tag:' + tag.id;
    item.innerHTML = `<span class="tag-dot" style="background:${tag.color}"></span>${tag.nombre}`;
    item.onclick = () => setFiltro('tag:' + tag.id, item);
    el.appendChild(item);
  });

  // Actualizar select del modal
  const sel = document.getElementById('modal-etiqueta');
  const valActual = sel.value;
  sel.innerHTML = '<option value="">Sin etiqueta</option>';
  etiquetas.forEach(tag => {
    const opt = document.createElement('option');
    opt.value = tag.id;
    opt.textContent = tag.nombre;
    sel.appendChild(opt);
  });
  sel.value = valActual;
}

// ═══════════════════════════════════
//  FILTRO / VISTA
// ═══════════════════════════════════
function setFiltro(filtro, itemEl) {
  filtroActivo = filtro;
  document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
  if (itemEl) itemEl.classList.add('active');
  renderNotas();
}

function notasFiltradas() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  return notas.filter(n => {
    if (filtroActivo === 'pinned'     && !n.pinned)    return false;
    if (filtroActivo === 'pinned'     && n.archivada)  return false;
    if (filtroActivo === 'archivadas' && !n.archivada) return false;
    if (filtroActivo === 'todas'      && n.archivada)  return false;
    if (filtroActivo.startsWith('tag:')) {
      const tagId = filtroActivo.slice(4);
      if (n.tagId !== tagId || n.archivada) return false;
    }
    if (q) {
      const en = (n.titulo + ' ' + n.contenido).toLowerCase();
      if (!en.includes(q)) return false;
    }
    return true;
  });
}

// ═══════════════════════════════════
//  CREAR TARJETA
// ═══════════════════════════════════
function crearTarjeta(nota) {
  const col = COLORES[nota.colorIdx ?? 0];
  const tag = etiquetas.find(t => t.id === nota.tagId);
  const card = document.createElement('div');
  card.className = 'nota-card' + (nota.pinned ? ' pinned' : '');
  card.style.background = col.bg;
  card.style.borderColor = col.border;

  const fecha = new Date(nota.fecha).toLocaleDateString('es-MX', {
    day: 'numeric', month: 'short'
  });

  card.innerHTML = `
    <div class="nota-pin">📌</div>
    ${nota.titulo ? `<div class="nota-titulo">${escHtml(nota.titulo)}</div>` : ''}
    ${nota.contenido ? `<div class="nota-contenido">${escHtml(nota.contenido)}</div>` : ''}
    <div class="nota-footer">
      ${tag ? `<span class="nota-tag" style="color:${tag.color};border-color:${tag.color}40">${tag.nombre}</span>` : ''}
      <span class="nota-fecha">${fecha}</span>
      <div class="nota-actions">
        <button class="nota-action-btn pin-btn" title="${nota.pinned ? 'Desfijar' : 'Fijar'}">📌</button>
        <button class="nota-action-btn arch-btn" title="${nota.archivada ? 'Desarchivar' : 'Archivar'}">📦</button>
        <button class="nota-action-btn danger del-btn" title="Eliminar">🗑</button>
      </div>
    </div>
  `;

  card.addEventListener('click', (e) => {
    if (e.target.closest('.nota-actions')) return;
    abrirModal(nota.id);
  });
  card.querySelector('.pin-btn').onclick = (e) => {
    e.stopPropagation();
    togglePin(nota.id);
  };
  card.querySelector('.arch-btn').onclick = (e) => {
    e.stopPropagation();
    toggleArchivar(nota.id);
  };
  card.querySelector('.del-btn').onclick = (e) => {
    e.stopPropagation();
    eliminarNota(nota.id);
  };

  return card;
}

// ═══════════════════════════════════
//  RENDER NOTAS
// ═══════════════════════════════════
function renderNotas() {
  const gridPinned = document.getElementById('grid-pinned');
  const gridNotas  = document.getElementById('grid-notas');
  const secPinned  = document.getElementById('seccion-pinned');
  const empty      = document.getElementById('empty');

  const todas = notasFiltradas();

  const claseGrid = modoVista === 'lista' ? 'notas-grid lista' : 'notas-grid';
  gridPinned.className = claseGrid;
  gridNotas.className  = claseGrid;
  gridPinned.innerHTML = '';
  gridNotas.innerHTML  = '';

  if (filtroActivo === 'pinned') {
    // En filtro Fijadas: mostrar todas en el grid normal, sin sección separada
    secPinned.style.display = 'none';
    gridNotas.style.display = '';
    todas.forEach(n => gridNotas.appendChild(crearTarjeta(n)));
  } else {
    // En otros filtros: separar fijadas arriba y el resto abajo
    const pinned = todas.filter(n => n.pinned);
    const otras  = todas.filter(n => !n.pinned);
    secPinned.style.display = pinned.length > 0 ? '' : 'none';
    gridNotas.style.display = '';
    pinned.forEach(n => gridPinned.appendChild(crearTarjeta(n)));
    otras.forEach(n => gridNotas.appendChild(crearTarjeta(n)));
  }

  empty.style.display = todas.length === 0 ? 'block' : 'none';
}

// ═══════════════════════════════════
//  ACCIONES
// ═══════════════════════════════════
function crearNota(titulo, contenido, colorIdx, pinned) {
  if (!titulo.trim() && !contenido.trim()) return;
  notas.unshift({
    id: Date.now().toString(),
    titulo: titulo.trim(),
    contenido: contenido.trim(),
    colorIdx, pinned,
    archivada: false,
    tagId: '',
    fecha: Date.now()
  });
  guardarLocal();
  renderNotas();
}

function togglePin(id) {
  const n = notas.find(n => n.id === id);
  if (n) { n.pinned = !n.pinned; guardarLocal(); renderNotas(); }
}

function toggleArchivar(id) {
  const n = notas.find(n => n.id === id);
  if (n) { n.archivada = !n.archivada; n.pinned = false; guardarLocal(); renderNotas(); }
}

function eliminarNota(id) {
  notas = notas.filter(n => n.id !== id);
  guardarLocal(); renderNotas();
}

// ═══════════════════════════════════
//  MODAL
// ═══════════════════════════════════
function abrirModal(id) {
  const n = notas.find(n => n.id === id);
  if (!n) return;
  editandoId = id;
  modalPinOn = n.pinned;
  modalColorIdx = n.colorIdx ?? 0;

  document.getElementById('modal-titulo').value    = n.titulo;
  document.getElementById('modal-contenido').value = n.contenido;
  document.getElementById('modal-etiqueta').value  = n.tagId ?? '';
  document.getElementById('modal-pin').classList.toggle('on', n.pinned);

  function actualizarModal(i) { modalColorIdx = i; renderColores('modal-colores', modalColorIdx, actualizarModal); }
  renderColores('modal-colores', modalColorIdx, actualizarModal);

  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('modal-contenido').focus();
}

function cerrarModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  editandoId = null;
}

function guardarModal() {
  if (!editandoId) return;
  const n = notas.find(n => n.id === editandoId);
  if (!n) return;
  n.titulo    = document.getElementById('modal-titulo').value.trim();
  n.contenido = document.getElementById('modal-contenido').value.trim();
  n.colorIdx  = modalColorIdx;
  n.pinned    = modalPinOn;
  n.tagId     = document.getElementById('modal-etiqueta').value;
  n.fecha     = Date.now();
  guardarLocal();
  renderNotas();
  cerrarModal();
}

// ═══════════════════════════════════
//  ETIQUETAS
// ═══════════════════════════════════
function nuevaEtiqueta() {
  const nombre = prompt('Nombre de la etiqueta:');
  if (!nombre?.trim()) return;
  const colors = ['#7c3aed','#3b82f6','#10b981','#f59e0b','#ef4444','#ec4899'];
  etiquetas.push({
    id: Date.now().toString(),
    nombre: nombre.trim(),
    color: colors[etiquetas.length % colors.length]
  });
  guardarLocal();
  renderSidebar();
}

// ═══════════════════════════════════
//  HELPERS
// ═══════════════════════════════════
function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/\n/g,'<br>');
}

// ═══════════════════════════════════
//  LISTENERS
// ═══════════════════════════════════
// Crear nota — expandir al focus
document.getElementById('crear-contenido').addEventListener('focus', () => {
  document.getElementById('crear-titulo').classList.add('visible');
  document.getElementById('crear-footer').classList.add('visible');
  function actualizarCrear(i) { crearColorIdx = i; renderColores('crear-colores', crearColorIdx, actualizarCrear); }
  renderColores('crear-colores', crearColorIdx, actualizarCrear);
});

// Crear nota — colapsar al click fuera
document.addEventListener('click', (e) => {
  const crear = document.getElementById('crear-nota');
  if (!crear.contains(e.target)) {
    document.getElementById('crear-titulo').classList.remove('visible');
    document.getElementById('crear-footer').classList.remove('visible');
  }
});

document.getElementById('crear-pin').addEventListener('click', (e) => {
  e.stopPropagation();
  crearPinOn = !crearPinOn;
  document.getElementById('crear-pin').classList.toggle('on', crearPinOn);
});

document.getElementById('btn-crear').addEventListener('click', () => {
  const titulo    = document.getElementById('crear-titulo').value;
  const contenido = document.getElementById('crear-contenido').value;
  crearNota(titulo, contenido, crearColorIdx, crearPinOn);
  document.getElementById('crear-titulo').value    = '';
  document.getElementById('crear-contenido').value = '';
  crearPinOn = false; crearColorIdx = 0;
  document.getElementById('crear-pin').classList.remove('on');
  document.getElementById('crear-titulo').classList.remove('visible');
  document.getElementById('crear-footer').classList.remove('visible');
});

// Enter en textarea sin shift → guardar
document.getElementById('crear-contenido').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    document.getElementById('btn-crear').click();
  }
});

// Búsqueda
document.getElementById('search').addEventListener('input', renderNotas);

// Vista
document.getElementById('btn-grid').addEventListener('click', () => {
  modoVista = 'grid';
  document.getElementById('btn-grid').classList.add('active');
  document.getElementById('btn-lista').classList.remove('active');
  renderNotas();
});
document.getElementById('btn-lista').addEventListener('click', () => {
  modoVista = 'lista';
  document.getElementById('btn-lista').classList.add('active');
  document.getElementById('btn-grid').classList.remove('active');
  renderNotas();
});

// Sidebar
document.querySelectorAll('.sidebar-item[data-filtro]').forEach(item => {
  item.addEventListener('click', () => setFiltro(item.dataset.filtro, item));
});
document.getElementById('btn-nueva-etiqueta').addEventListener('click', nuevaEtiqueta);

// Modal
document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modal-overlay')) cerrarModal();
});
document.getElementById('modal-guardar').addEventListener('click', guardarModal);
document.getElementById('modal-pin').addEventListener('click', () => {
  modalPinOn = !modalPinOn;
  document.getElementById('modal-pin').classList.toggle('on', modalPinOn);
});
document.getElementById('modal-contenido').addEventListener('keydown', (e) => {
  if (e.key === 'Escape') cerrarModal();
});

// Back
document.getElementById('btn-back').addEventListener('click', () =>
  window.chrome.webview.postMessage('navigate:nuevatab'));

// ═══════════════════════════════════
//  COMUNICACIÓN C#
// ═══════════════════════════════════
window.chrome.webview.addEventListener('message', e => {
  const raw = e.data;
  if (typeof raw !== 'string') return;

  if (raw.startsWith('notes:datos:')) {
  try {
    const data = JSON.parse(raw.slice('notes:datos:'.length));
    notas     = Array.isArray(data.notas)     ? data.notas     : [];
    etiquetas = Array.isArray(data.etiquetas) ? data.etiquetas : [];
    renderSidebar();
    renderNotas();
  } catch(e) {
    console.error('Error cargando notas:', e);
    notas = []; etiquetas = [];
    renderSidebar(); renderNotas();
  }
  } else if (raw.startsWith('notes:chunk-load:')) {
      const partes = raw.split(':', 4);
      const idx    = parseInt(partes[1]);
      const total  = parseInt(partes[2]);
      const datos  = raw.slice(`notes:chunk-load:${partes[1]}:${partes[2]}:`.length);
      
      if (!window._loadChunks) window._loadChunks = '';
      window._loadChunks += datos;
      
      if (idx === total - 1) {
          try {
              const data = JSON.parse(window._loadChunks);
              window._loadChunks = '';
              notas     = Array.isArray(data.notas)     ? data.notas     : [];
              etiquetas = Array.isArray(data.etiquetas) ? data.etiquetas : [];
              renderSidebar();
              renderNotas();
          } catch(e) {
              console.error('Error cargando chunks:', e);
              window._loadChunks = '';
          }
      }
  } else if (raw.startsWith('tema:')) {
    try {
      const t = JSON.parse(raw.slice('tema:'.length));
      const r = document.documentElement;
      const hex = t.Accent ?? t.accent ?? '#7c3aed';
      r.style.setProperty('--accent', hex);
      r.style.setProperty('--bg',       t.Bg      ?? t.bg      ?? '#0d0d14');
      r.style.setProperty('--surface',  t.Surface ?? t.surface ?? '#13131f');
      r.style.setProperty('--surface2', t.Surface2 ?? t.surface2 ?? '#1a1a2e');
      const hx = hex.replace('#','');
      const rr = parseInt(hx.slice(0,2),16);
      const gg = parseInt(hx.slice(2,4),16);
      const bb = parseInt(hx.slice(4,6),16);
      r.style.setProperty('--border', `rgba(${rr},${gg},${bb},0.2)`);
      r.style.setProperty('--accent-r', rr);
      r.style.setProperty('--accent-g', gg);
      r.style.setProperty('--accent-b', bb);
    } catch {}
  }
  if (raw.startsWith('notes:debug:')) {
    alert(raw); // mostrar info de debug
    return;
  }
});

window.chrome.webview.postMessage('get:tema');

</script>
