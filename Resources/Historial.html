<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<title>Historial</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --accent: #7c3aed;
    --bg: #0d0d14;
    --surface: #13131f;
    --surface2: #1a1a2e;
    --border: rgba(124,58,237,0.25);
    --text: rgba(255,255,255,0.85);
    --muted: rgba(255,255,255,0.35);
  }

  body {
  font-family: 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  }

  #main {
    flex: 1;
    padding: 40px;
    overflow-y: auto;
  }

  #main {
  padding: 40px 40px 40px 32px;
  }

  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
  }

  #header h2 {
    font-size: 22px;
    font-weight: 300;
    color: white;
    letter-spacing: -0.5px;
  }

  #header h2 span { color: var(--accent); }

  #btn-limpiar {
    background: rgba(255,51,102,0.1);
    border: 1px solid var(--border);
    color: var(--accent);
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    font-family: 'Segoe UI', sans-serif;
    letter-spacing: 0.05em;
    transition: background 0.15s;
  }

  #btn-limpiar:hover { background: rgba(255,51,102,0.2); }

  #search-wrap {
    display: flex;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0 16px;
    height: 40px;
    margin-bottom: 28px;
    position: relative;
  }

  #search-wrap::before {
    content: '';
    position: absolute;
    left: 0; top: 0;
    width: 3px; height: 100%;
    background: var(--accent);
    border-radius: 4px 0 0 4px;
  }

  #search-historial {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: white;
    font-size: 13px;
    font-family: 'Segoe UI', sans-serif;
    margin-left: 10px;
  }

  #search-historial::placeholder { color: var(--muted); }

  .day-group { margin-bottom: 28px; }

  .day-label {
    font-size: 11px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .entry {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
    border: 1px solid transparent;
  }

  .entry:hover {
    background: var(--surface);
    border-color: var(--border);
  }

  .entry-time {
    font-size: 11px;
    color: var(--muted);
    min-width: 42px;
    text-align: right;
  }

  .entry-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--border);
    flex-shrink: 0;
  }

  .entry:hover .entry-dot { background: var(--accent); }

  .entry-info { flex: 1; overflow: hidden; }

  .entry-title {
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .entry-url {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }

  #empty {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-top: 80px;
  }

  #empty p { margin-top: 8px; font-size: 12px; }

  body {
  display: flex;
}

#sidebar {
  width: 240px;
  min-width: 240px;
  height: 100vh;
  position: sticky;
  top: 0;
  background: #0a0a10;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

#sidebar-header {
  padding: 20px 16px 12px;
  border-bottom: 1px solid var(--border);
}

#accent-bar {
  width: 32px; height: 2px;
  background: var(--accent);
  border-radius: 2px;
  margin-bottom: 8px;
}

#sidebar-header h1 {
  font-size: 15px; font-weight: 700;
  color: white; letter-spacing: 0.05em;
  text-transform: uppercase;
}

#sidebar-header p {
  font-size: 11px; color: var(--muted);
  margin-top: 2px;
}

.sb-section {
  padding: 16px 8px 4px;
}

.sb-section-label {
  font-size: 10px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.12em;
  padding: 0 8px; margin-bottom: 4px;
}

.sb-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 6px;
  cursor: pointer; font-size: 13px; color: var(--muted);
  transition: all 0.15s; border: 1px solid transparent;
  text-decoration: none; position: relative;
}

.sb-item:hover {
  background: rgba(255,255,255,0.04);
  color: var(--text);
}

.sb-item.active {
  background: rgba(255,255,255,0.06);
  border-color: var(--border);
  color: white;
}

.sb-item.active::before {
  content: '';
  position: absolute; left: 0; top: 20%; bottom: 20%;
  width: 2px; border-radius: 2px;
  background: var(--accent);
}

.sb-icon {
  width: 18px; text-align: center;
  font-size: 14px; opacity: 0.7;
  flex-shrink: 0;
}

.sb-item.active .sb-icon { opacity: 1; }

#sidebar-footer {
  margin-top: auto;
  padding: 12px 16px;
  border-top: 1px solid var(--border);
}

#sidebar-footer p { font-size: 10px; color: var(--muted); }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <div id="accent-bar"></div>
    <h1>AtsukiBrowser</h1>
    <p>v0.4 Alpha</p>
  </div>

  <div class="sb-section">
    <div class="sb-section-label">Herramientas</div>
    <a class="sb-item" onclick="window.chrome.webview.postMessage('navigate:favoritos'); return false;" href="#">
      <span class="sb-icon">⭐</span> Favoritos
    </a>
    <a class="sb-item active" onclick="window.chrome.webview.postMessage('navigate:historial'); return false;" href="#">
      <span class="sb-icon">🕐</span> Historial
    </a>
    <a class="sb-item" id="sb-perfiles" href="#">
      <span class="sb-icon">👤</span> Perfiles
    </a>
  </div>

  <div class="sb-section">
    <div class="sb-section-label">Ajustes</div>
    <a class="sb-item" onclick="window.chrome.webview.postMessage('navigate:ajustes'); return false;" href="#">
      <span class="sb-icon">🎨</span> Apariencia
    </a>
  </div>

  <div id="sidebar-footer">
    <p>AtsukiBrowser · v0.4 Alpha</p>
  </div>
</div>

<div id="main">
  <div id="header">
    <h2>Historial de <span>navegación</span></h2>
    <button id="btn-limpiar">Limpiar historial</button>
  </div>

  <div id="search-wrap">
    <span style="color:var(--muted);font-size:14px">🔍</span>
    <input id="search-historial" type="text" placeholder="Buscar en el historial..." />
  </div>

  <div id="lista"></div>
</div>

<script>
  let entradas = [];
  function hexToRgba(hex, alpha) {
    hex = hex.replace('#','');
    const r = parseInt(hex.slice(0,2),16);
    const g = parseInt(hex.slice(2,4),16);
    const b = parseInt(hex.slice(4,6),16);
    return `rgba(${r},${g},${b},${alpha})`;
  }
  
  function aplicarTema(t) {
    const root = document.documentElement;
    root.style.setProperty('--accent',   t.Accent   ?? t.accent);
    root.style.setProperty('--bg',       t.Bg       ?? t.bg);
    root.style.setProperty('--surface',  t.Surface  ?? t.surface);
    root.style.setProperty('--surface2', t.Surface2 ?? t.surface2);
    root.style.setProperty('--border',   hexToRgba(t.Accent ?? t.accent, 0.25));
    if (t.Font ?? t.font)
        root.style.setProperty('--font', `'${t.Font ?? t.font}', sans-serif`);
  }  
  
  // Escuchar respuestas desde C#
  window.chrome.webview.addEventListener('message', e => {
    const raw = e.data;
    if (typeof raw === 'string' && raw.startsWith('historial:')) {
      const json = raw.slice('historial:'.length);
      entradas = JSON.parse(json);
      renderizar(entradas);
    }
    if (typeof raw === 'string' && raw.startsWith('tema:')) {
      aplicarTema(JSON.parse(raw.slice('tema:'.length)));
    }
  });

  function cargarHistorial() {
    window.chrome.webview.postMessage('get:historial');
  }

  function renderizar(datos) {
    const lista = document.getElementById('lista');
    lista.innerHTML = '';

    if (datos.length === 0) {
      lista.innerHTML = '<div id="empty">🕐<p>No hay historial todavía.</p></div>';
      return;
    }

    const grupos = {};
    datos.forEach(e => {
      const fecha = new Date(e.Fecha ?? e.fecha);
      const hoy = new Date();
      const ayer = new Date(); ayer.setDate(ayer.getDate() - 1);
      let label;
      if (fecha.toDateString() === hoy.toDateString()) label = 'Hoy';
      else if (fecha.toDateString() === ayer.toDateString()) label = 'Ayer';
      else label = fecha.toLocaleDateString('es-MX', {
        weekday: 'long', day: 'numeric', month: 'long'
      });

      if (!grupos[label]) grupos[label] = [];
      grupos[label].push({ ...e, fecha });
    });

    Object.entries(grupos).forEach(([dia, items]) => {
      const group = document.createElement('div');
      group.className = 'day-group';
      group.innerHTML = `<div class="day-label">${dia}</div>`;

      items.forEach(item => {
        const h = String(item.fecha.getHours()).padStart(2,'0');
        const m = String(item.fecha.getMinutes()).padStart(2,'0');
        const entry = document.createElement('div');
        entry.className = 'entry';
        entry.innerHTML = `
          <span class="entry-time">${h}:${m}</span>
          <div class="entry-dot"></div>
          <div class="entry-info">
            <div class="entry-title">${item.Titulo ?? item.titulo ?? item.Url ?? item.url}</div>
            <div class="entry-url">${item.Url ?? item.url}</div>
          </div>
        `;
        entry.addEventListener('click', () => {
          window.chrome.webview.postMessage('navigate:' + (item.Url ?? item.url));
        });
        group.appendChild(entry);
      });

      lista.appendChild(group);
    });
  }

  document.getElementById('search-historial').addEventListener('input', function() {
    const q = this.value.toLowerCase();
    const filtrado = entradas.filter(e =>
      (e.Titulo ?? e.titulo ?? '').toLowerCase().includes(q) ||
      (e.Url ?? e.url ?? '').toLowerCase().includes(q)
    );
    renderizar(filtrado);
  });

  document.getElementById('btn-limpiar').addEventListener('click', () => {
    if (confirm('¿Limpiar todo el historial?')) {
      window.chrome.webview.postMessage('limpiar:historial');
      entradas = [];
    }
  });

  document.getElementById('sb-perfiles')?.addEventListener('click', e => {
    e.preventDefault();
    window.chrome.webview.postMessage('perfiles');
  });

  cargarHistorial();
</script>
</body>
</html>
