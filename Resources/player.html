<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
</head>
<body style="margin:0;padding:0;background:transparent;overflow:hidden;">
<audio id="audio" preload="auto" crossorigin="anonymous"></audio>
<iframe id="ytFrame" 
        style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;"
        allow="autoplay; encrypted-media"
        frameborder="0"></iframe>
<script>
(function() {
    const audio = document.getElementById('audio');
    let playlists = [{ nombre: 'Principal', imagen: null, canciones: [] }];
    let playlistActiva = 0;
    let indice = 0;
    let shuffle = false;
    let repeat = 'none';
    let volumen = 0.8;
    let crossfadeSeg = 0;
    let shuffleOrder = [];

    audio.volume = volumen;

    function playlist() { return playlists[playlistActiva]; }
    function canciones() { return playlist().canciones; }

    // Desbloquear AudioContext al primer mensaje del host
    function desbloquearAudio() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (ctx.state === 'suspended') ctx.resume();
        } catch(e) {}
    }
    window.chrome.webview.addEventListener('message', desbloquearAudio, { once: true });

    function generarShuffleOrder() {
        shuffleOrder = [...Array(canciones().length).keys()];
        for (let i = shuffleOrder.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffleOrder[i], shuffleOrder[j]] = [shuffleOrder[j], shuffleOrder[i]];
        }
    }

    function cancionActual() { return canciones()[indice] ?? null; }

    // Rastrear qué playlist/índice está sonando realmente
    let playlistSonando = 0;
    let indiceSonando = 0;

    function cancionSonando() {
        return playlists[playlistSonando]?.canciones[indiceSonando] ?? null;
    }

    function enviarEstado() {
        const cancion = cancionSonando();
        const plSonando = playlists[playlistSonando];
        window.chrome.webview.postMessage('musica:estado:' + JSON.stringify({
            reproduciendo: !audio.paused,
            titulo:  cancion?.titulo  ?? '',
            autor:   cancion?.autor   ?? '',
            imagen:  cancion?.imagen  ?? '',
            indice:  indiceSonando,
            total:   plSonando?.canciones.length ?? 0,
            volumen,
            shuffle,
            repeat,
            progreso: audio.currentTime,
            duracion: audio.duration || 0,
            playlistActiva,
            playlistNombre: plSonando?.nombre ?? '',
            playlistImagen: plSonando?.imagen ?? ''
        }));
    }

    function enviarPlaylists() {
        window.chrome.webview.postMessage('musica:playlists:' + JSON.stringify(
            playlists.map(p => ({ nombre: p.nombre, imagen: p.imagen ?? '', total: p.canciones.length }))
        ));
    }

    function cargarYReproducir(idx) {
        if (canciones().length === 0) return;
        indice = idx;
        indiceSonando = idx;
        playlistSonando = playlistActiva;
        const cancion = cancionActual();
        if (!cancion) return;

        audio.oncanplay = null;
        audio.oncanplaythrough = null;
        audio.pause();

        window.chrome.webview.postMessage('musica:notify:' + cancion.titulo + '|' + (cancion.imagen || playlist().imagen || ''));

        let intentos = 0;
        const maxIntentos = 5;
        const delayEntreIntentos = 2000;

        function intentarCargar() {
            audio.src = cancion.url;
            audio.load();
            audio.oncanplay = null;
            audio.oncanplaythrough = null;

            const intentarPlay = () => {
                audio.oncanplay = null;
                audio.oncanplaythrough = null;
                audio.play().catch(err =>
                    window.chrome.webview.postMessage('musica:notify:ERROR play: ' + err.message + '|'));
            };

            audio.oncanplay = intentarPlay;

            // Si en delayEntreIntentos ms no cargó, reintentar
            setTimeout(() => {
                if (audio.paused && (audio.readyState < 3)) {
                    intentos++;
                    if (intentos < maxIntentos) {
                        intentarCargar();
                    } else {
                        window.chrome.webview.postMessage('musica:notify:❌ No se pudo cargar el stream|');
                    }
                }
            }, delayEntreIntentos);
        }

        intentarCargar();
        enviarEstado();
    }

    function aleatorio() {
        if (canciones().length === 0) return;
        const idx = Math.floor(Math.random() * canciones().length);
        cargarYReproducir(idx);
    }

    function siguiente(manual = false) {
        if (canciones().length === 0) return;
        if (repeat === 'one') { audio.currentTime = 0; audio.play().catch(() => {}); return; }
        if (shuffle) {
            const idx = shuffleOrder.indexOf(indice);
            cargarYReproducir(shuffleOrder[(idx + 1) % shuffleOrder.length]);
        } else {
            const next = (indice + 1) % canciones().length;
            if (next === 0 && repeat === 'none' && !manual) { 
                audio.pause(); 
                enviarEstado(); 
                return; 
            }
            cargarYReproducir(next);
        }
    }

    function anterior() {
        if (canciones().length === 0) return;
        if (audio.currentTime > 3) { audio.currentTime = 0; return; }
        if (shuffle) {
            const idx = shuffleOrder.indexOf(indice);
            cargarYReproducir(shuffleOrder[(idx - 1 + shuffleOrder.length) % shuffleOrder.length]);
        } else {
            cargarYReproducir((indice - 1 + canciones().length) % canciones().length);
        }
    }

    audio.addEventListener('ended', () => siguiente(false));
    audio.addEventListener('timeupdate', () => {
        if (Math.floor(audio.currentTime) % 2 === 0) enviarEstado();
    });
    audio.addEventListener('play', enviarEstado);
    audio.addEventListener('pause', enviarEstado);
    audio.addEventListener('error', e => {
        const err = audio.error;
        let detalle = 'desconocido';
        if (err) {
            const codigos = { 1:'ABORTED',2:'NETWORK',3:'DECODE',4:'SRC_NOT_SUPPORTED' };
            detalle = `[${err.code}] ${codigos[err.code] ?? ''} - ${err.message}`;
        }
        window.chrome.webview.postMessage('musica:notify:❌ ' + detalle + '|');
    });

    window.chrome.webview.addEventListener('message', e => {
        const msg = e.data;
        if (typeof msg !== 'string') return;

        if (msg === 'player:play') {
            audio.play().catch(err =>
                window.chrome.webview.postMessage('musica:notify:ERROR play: ' + err.message + '|'));
        } else if (msg === 'player:pause') {
            audio.pause();
        } else if (msg === 'player:siguiente') {
            siguiente(true);
        } else if (msg === 'player:anterior') {
            anterior();
        } else if (msg === 'player:aleatorio') {
            aleatorio();
        } else if (msg.startsWith('player:volumen:')) {
            volumen = parseFloat(msg.slice('player:volumen:'.length));
            audio.volume = volumen;
            enviarEstado();
        } else if (msg.startsWith('player:shuffle:')) {
            shuffle = msg.endsWith('true');
            if (shuffle) generarShuffleOrder();
            enviarEstado();
        } else if (msg.startsWith('player:repeat:')) {
            repeat = msg.slice('player:repeat:'.length);
            enviarEstado();
        } else if (msg.startsWith('player:playlists:')) {
            const nuevas = JSON.parse(msg.slice('player:playlists:'.length));

            // Guardar estado actual antes de actualizar
            const playlistActivaAntes = playlistActiva;
            const tituloActual = cancionActual()?.titulo ?? '';
            const estaReproduciendo = !audio.paused;

            playlists = nuevas;

            // Restaurar playlist activa si sigue existiendo
            if (playlistActivaAntes < playlists.length)
                playlistActiva = playlistActivaAntes;
            else
                playlistActiva = 0;

            // Restaurar índice de canción actual
            if (tituloActual) {
                const nuevoIdx = canciones().findIndex(c => c.titulo === tituloActual);
                if (nuevoIdx >= 0) indice = nuevoIdx;
                else if (indice >= canciones().length) indice = 0;
            }

            // NO tocar el audio — solo regenerar shuffle si hace falta
            if (shuffle) generarShuffleOrder();
            enviarEstado();
            enviarPlaylists();
        } else if (msg.startsWith('player:playlists_silent:')) {
            // Cargar playlists sin tocar el audio ni reproducir nada
            const nuevas = JSON.parse(msg.slice('player:playlists_silent:'.length));
            playlists = nuevas;
            playlistActiva = 0;
            indice = 0;
            if (shuffle) generarShuffleOrder();
            enviarPlaylists();
        } else if (msg.startsWith('player:switchplaylist:')) {
            const idx = parseInt(msg.slice('player:switchplaylist:'.length));
            if (idx >= 0 && idx < playlists.length) {
                playlistActiva = idx;
                // NO resetear indice ni tocar audio — solo cambiar contexto visual
                if (shuffle) generarShuffleOrder();
                enviarEstado();
                enviarPlaylists();
            }
        } else if (msg.startsWith('player:reproducir:')) {
            cargarYReproducir(parseInt(msg.slice('player:reproducir:'.length)));
            setTimeout(enviarEstado, 300);
        } else if (msg === 'player:estado') {
            enviarEstado();
            enviarPlaylists();
        } else if (msg.startsWith('player:seek:')) {
            audio.currentTime = parseFloat(msg.slice('player:seek:'.length));
        } else if (msg.startsWith('player:velocidad:')) {
            const vel = parseFloat(msg.slice('player:velocidad:'.length));
            if (!isNaN(vel) && vel > 0) {
                audio.playbackRate = vel;
                enviarEstado();
            }
        }
    });

    enviarEstado();
    enviarPlaylists();

    // ── Visualizador ──
    const vizCanvas = document.createElement('canvas');
    vizCanvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;';
    document.body.appendChild(vizCanvas);
    const vizCtx = vizCanvas.getContext('2d');

    let audioCtx, analyser, animFrame;

    function iniciarVisualizador() {
        if (audioCtx) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 64;
            const source = audioCtx.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
        } catch(e) {}
    }

    function dibujarViz() {
        if (!analyser) return;
        animFrame = requestAnimationFrame(dibujarViz);

        const W = vizCanvas.width  = vizCanvas.offsetWidth;
        const H = vizCanvas.height = vizCanvas.offsetHeight;
        vizCtx.clearRect(0, 0, W, H);

        const data = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(data);

        const count = Math.min(data.length, 28);
        const gap   = 2;
        const barW  = (W / count) - gap;

        for (let i = 0; i < count; i++) {
            const v  = data[i] / 255;
            const bH = Math.max(2, v * H);
            const r  = 124 + Math.round(v * 80);
            const g  = 58  + Math.round(v * 20);
            vizCtx.fillStyle = `rgba(${r},${g},237,0.85)`;
            vizCtx.beginPath();
            vizCtx.roundRect(i * (barW + gap), H - bH, barW, bH, 2);
            vizCtx.fill();
        }
    }

    audio.addEventListener('play', () => {
        iniciarVisualizador();
        if (audioCtx?.state === 'suspended') audioCtx.resume();
        cancelAnimationFrame(animFrame);
        dibujarViz();
    });

    audio.addEventListener('pause', () => cancelAnimationFrame(animFrame));
    audio.addEventListener('ended', () => cancelAnimationFrame(animFrame));
})();
</script>
</body>
</html>
