<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<title>AtsukiDraw</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; }
:root {
  --accent:   #7c3aed;
  --bg:       #0d0d14;
  --surface:  #13131f;
  --surface2: #1a1a2e;
  --border:   rgba(124,58,237,0.2);
  --text:     rgba(255,255,255,0.85);
  --muted:    rgba(255,255,255,0.35);
  --ar: 124; --ag: 58; --ab: 237;
}
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* ── TOPBAR ── */
#topbar {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px; background: var(--surface);
  border-bottom: 1px solid var(--border); flex-shrink: 0; height: 44px;
}
#btn-back { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: color 0.15s; }
#btn-back:hover { color: var(--text); }
#app-title { font-size: 15px; font-weight: 300; color: white; letter-spacing: 0.05em; margin-right: 8px; }
#app-title span { color: var(--accent); }
.top-sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }
.top-btn {
  background: none; border: 1px solid transparent; color: var(--muted);
  padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px;
  font-family: inherit; transition: all 0.15s; display: flex; align-items: center; gap: 5px;
}
.top-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }
.top-btn.danger:hover { color: #ef4444; border-color: rgba(239,68,68,0.3); }
#topbar-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
#zoom-label { font-size: 11px; color: var(--muted); min-width: 40px; text-align: center; }

/* ── LAYOUT ── */
#layout { display: flex; flex: 1; overflow: hidden; }

/* ── TOOLBAR ── */
#toolbar {
  width: 52px; background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center;
  padding: 8px 0; gap: 2px; flex-shrink: 0; overflow-y: auto;
}
.tool-btn {
  width: 38px; height: 38px; border-radius: 8px; border: 1px solid transparent;
  background: none; color: var(--muted); cursor: pointer; font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; position: relative;
}
.tool-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }
.tool-btn.active { background: rgba(var(--ar),var(--ag),var(--ab),0.15); color: var(--accent); border-color: var(--border); }
.tool-sep { width: 28px; height: 1px; background: var(--border); margin: 4px 0; }

/* ── PROPERTIES PANEL ── */
#props {
  width: 200px; background: var(--surface); border-right: 1px solid var(--border);
  padding: 12px; display: flex; flex-direction: column; gap: 12px;
  flex-shrink: 0; overflow-y: auto;
}
.prop-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
.prop-section { display: flex; flex-direction: column; }

.color-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.color-swatch {
  width: 100%; aspect-ratio: 1; border-radius: 4px; cursor: pointer;
  border: 2px solid transparent; transition: transform 0.1s;
}
.color-swatch:hover { transform: scale(1.1); }
.color-swatch.selected { border-color: white; }

#color-custom {
  width: 100%; height: 28px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface2); cursor: pointer; margin-top: 4px;
}

.slider-wrap { display: flex; align-items: center; gap: 8px; }
.prop-slider {
  flex: 1; -webkit-appearance: none; height: 4px; border-radius: 2px;
  background: var(--surface2); outline: none;
}
.prop-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
  background: var(--accent); cursor: pointer;
}
.slider-val { font-size: 11px; color: var(--muted); min-width: 24px; text-align: right; }

.prop-row { display: flex; gap: 4px; }
.prop-btn {
  flex: 1; padding: 6px; border-radius: 6px; border: 1px solid var(--border);
  background: none; color: var(--muted); cursor: pointer; font-size: 11px;
  font-family: inherit; transition: all 0.15s; text-align: center;
}
.prop-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }
.prop-btn.active { background: rgba(var(--ar),var(--ag),var(--ab),0.15); color: var(--accent); border-color: rgba(var(--ar),var(--ag),var(--ab),0.4); }

#font-size-input {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); border-radius: 6px; padding: 5px 8px; font-size: 12px;
  font-family: inherit; outline: none;
}

/* ── CANVAS AREA ── */
#canvas-wrap {
  flex: 1; position: relative; overflow: hidden;
  background: #1a1a2e;
  background-image: radial-gradient(circle, rgba(124,58,237,0.08) 1px, transparent 1px);
  background-size: 24px 24px;
}
#canvas-bg { position: absolute; top: 0; left: 0; }
#canvas-main { position: absolute; top: 0; left: 0; cursor: crosshair; }
#canvas-overlay { position: absolute; top: 0; left: 0; pointer-events: none; }

/* Images layer */
#images-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
.img-obj {
  position: absolute; pointer-events: all; cursor: move;
  border: 2px solid transparent;
}
.img-obj.selected { border-color: var(--accent); }
.img-obj img { width: 100%; height: 100%; display: block; pointer-events: none; }
.resize-handle {
  position: absolute; width: 10px; height: 10px; background: var(--accent);
  border-radius: 2px; border: 1px solid white;
}
.img-obj { position: absolute; }
.resize-handle.tl { top: -5px; left: -5px; cursor: nw-resize; }
.resize-handle.tr { top: -5px; right: -5px; cursor: ne-resize; }
.resize-handle.bl { bottom: -5px; left: -5px; cursor: sw-resize; }
.resize-handle.br { bottom: -5px; right: -5px; cursor: se-resize; }

/* Figuras */
#shapes-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
.shape-obj {
  position: absolute;
  pointer-events: all;
  cursor: move;
  border: 1px solid transparent;
}
.shape-obj.selected { border: 1px dashed rgba(124,58,237,0.6); }

/* Text input overlay */
#text-input {
  position: absolute; display: none;
  background: transparent; border: 1px dashed var(--accent);
  color: var(--text); outline: none; resize: none; padding: 2px 4px;
  font-family: 'Segoe UI', sans-serif; min-width: 80px; min-height: 28px;
  z-index: 100;
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

#ctx-menu {
  position: fixed;
  z-index: 1000;
  background: #13131f;
  border: 1px solid rgba(124,58,237,0.3);
  border-radius: 8px;
  padding: 4px;
  min-width: 160px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  display: none;
}
#ctx-menu.open { display: block; }
.ctx-item {
  padding: 7px 12px;
  font-size: 12px;
  color: rgba(255,255,255,0.75);
  border-radius: 5px;
  cursor: pointer;
  transition: background 0.1s;
}
.ctx-item:hover { background: rgba(124,58,237,0.15); color: white; }
.ctx-item.danger { color: #ef4444; }
.ctx-item.danger:hover { background: rgba(239,68,68,0.1); }
.ctx-sep {
  height: 1px;
  background: rgba(124,58,237,0.15);
  margin: 3px 0;
}

/* Textos */
#textos-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
.texto-obj {
  position: absolute;
  pointer-events: all;
  cursor: move;
  min-width: 60px;
  min-height: 28px;
  box-sizing: border-box;
  background: transparent;
  border: 2px dashed transparent;
}
.texto-obj.selected {
  border: 2px dashed rgba(124,58,237,0.8);
  cursor: move;
}
.texto-obj.editing {
  border: 2px solid rgba(124,58,237,0.5);
  cursor: text;
}
.texto-content {
  width: 100%;
  height: 100%;
  background: transparent;
  border: none;
  outline: none;
  resize: none;
  font-family: 'Segoe UI', sans-serif;
  padding: 4px;
  cursor: text;
  display: block;
  box-sizing: border-box;
  overflow: hidden;
  color: inherit;
}

#canvas-bg      { position: absolute; top: 0; left: 0; z-index: 1; }
#canvas-main    { position: absolute; top: 0; left: 0; cursor: crosshair; z-index: 2; }
#shapes-layer   { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
#textos-layer   { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }
#images-layer   { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
#canvas-overlay { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 6; }

/* ═══════════════════════════════════════
   LAYOUT: MSPAINT
═══════════════════════════════════════ */
body.layout-mspaint #layout {
  flex-direction: column;
}
body.layout-mspaint #toolbar {
  width: 100%;
  height: auto;
  flex-direction: row;
  border-right: none;
  border-bottom: 1px solid var(--border);
  padding: 6px 12px;
  flex-wrap: wrap;
  gap: 4px;
  overflow: visible;
  align-items: center;
}
body.layout-mspaint #toolbar .tool-sep {
  width: 1px; height: 28px;
  background: var(--border);
  margin: 0 2px;
}
body.layout-mspaint #toolbar .tool-btn {
  width: 32px; height: 32px;
}
body.layout-mspaint #props {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  width: 100%;
  height: 50px;
  border-top: 1px solid var(--border);
  border-right: none;
  flex-direction: row;
  align-items: center;
  padding: 0 16px;
  gap: 20px;
  overflow: hidden;
  background: #0a0a10;
  z-index: 100;
}
body.layout-mspaint #props .prop-section {
  flex-direction: row;
  align-items: center;
  gap: 8px;
  border-bottom: none;
  padding: 0;
}
body.layout-mspaint #props .prop-label { display: none; }
body.layout-mspaint #props .slider-wrap { flex-direction: row; gap: 6px; }
body.layout-mspaint #canvas-wrap { margin-bottom: 50px; }

/* ═══════════════════════════════════════
   LAYOUT: EXCALIDRAW
═══════════════════════════════════════ */

/* ═══════════════════════════════════════
   LAYOUT: EXCALIDRAW
═══════════════════════════════════════ */

/* Ocultar sidebar de props completamente */
body.layout-excalidraw #props {
  display: none !important;
  width: 0 !important;
  padding: 0 !important;
  border: none !important;
  overflow: hidden !important;
}

/* Canvas ocupa toda la pantalla */
body.layout-excalidraw #canvas-wrap {
  position: fixed;
  inset: 0;
  z-index: 0;
}

/* Toolbar flotante centrado — position:fixed lo saca del flujo flex */
body.layout-excalidraw #toolbar {
  position: fixed;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  width: auto; height: auto;
  flex-direction: row;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: rgba(13,13,20,0.92);
  backdrop-filter: blur(12px);
  padding: 6px 10px;
  gap: 2px;
  z-index: 100;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}
body.layout-excalidraw #toolbar .tool-sep {
  width: 1px; height: 24px;
  background: var(--border);
  margin: 0 4px;
}
body.layout-excalidraw #toolbar .tool-btn {
  width: 34px; height: 34px;
  border-radius: 8px;
}

/* Topbar visible y fijo */
body.layout-excalidraw #topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 101;
  display: flex;
  background: rgba(13,13,20,0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}

/* Props flotante abajo centrado */
#props-float { display: none; }
body.layout-excalidraw #props-float {
  display: flex !important;
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  background: rgba(13,13,20,0.92);
  border: 1px solid var(--border);
  border-radius: 12px;
  backdrop-filter: blur(12px);
  padding: 8px 16px;
  gap: 16px;
  align-items: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

/* ═══════════════════════════════════════
   LAYOUT: DARK PRO
═══════════════════════════════════════ */
body.layout-dark-pro #toolbar {
  width: 48px;
  padding: 8px 6px;
  gap: 2px;
  background: #08080f;
}
body.layout-dark-pro #toolbar .tool-btn {
  width: 34px; height: 34px;
  font-size: 14px;
}
body.layout-dark-pro #props {
  width: 180px;
  background: #08080f;
  gap: 0;
}
body.layout-dark-pro #props .prop-section {
  padding: 10px 12px;
  border-bottom: 1px solid rgba(124,58,237,0.08);
}
body.layout-dark-pro #props .prop-label {
  font-size: 9px;
  letter-spacing: 0.15em;
  color: rgba(124,58,237,0.6);
  margin-bottom: 8px;
}
body.layout-dark-pro #canvas-wrap {
  background: #0a0a10;
}

</style>
</head>
<body>

<!-- TOPBAR -->
<div id="topbar">
  <button id="btn-back">←</button>
  <div id="app-title">Atsuki<span>Draw</span></div>
  <div class="top-sep"></div>
  <button class="top-btn" id="btn-undo">↩ Deshacer</button>
  <button class="top-btn" id="btn-redo">↪ Rehacer</button>
  <div class="top-sep"></div>
  <button class="top-btn" id="btn-img">🖼 Imagen</button>
  <button class="top-btn" id="btn-save">💾 Guardar PNG</button>
  <button class="top-btn danger" id="btn-clear">🗑 Limpiar</button>
  <div id="topbar-right">
    <button class="top-btn" id="btn-zoom-out">−</button>
    <span id="zoom-label">100%</span>
    <button class="top-btn" id="btn-zoom-in">+</button>
    <button class="top-btn" id="btn-zoom-reset">⊡</button>
  </div>
  <div id="layout-selector" style="display:flex;gap:4px;margin-left:8px">
    <button class="layout-btn active" data-layout="default" title="Default">⊞</button>
    <button class="layout-btn" data-layout="mspaint" title="MS Paint">🖼</button>
    <button class="layout-btn" data-layout="excalidraw" title="Excalidraw">✏</button>
    <button class="layout-btn" data-layout="dark-pro" title="Dark Pro">◈</button>
  </div>
</div>

<!-- LAYOUT -->
<div id="layout">

  <!-- TOOLBAR -->
  <div id="toolbar">
    <button class="tool-btn active" data-tool="pencil"    title="Lápiz (P)">✏️</button>
    <button class="tool-btn"        data-tool="eraser"    title="Borrador (E)">🧹</button>
    <button class="tool-btn"        data-tool="fill"      title="Relleno (F)">🪣</button>
    <div class="tool-sep"></div>
    <button class="tool-btn"        data-tool="line"      title="Línea (L)">╱</button>
    <button class="tool-btn"        data-tool="rect"      title="Rectángulo (R)">▭</button>
    <button class="tool-btn"        data-tool="circle"    title="Círculo (C)">○</button>
    <button class="tool-btn"        data-tool="triangle"  title="Triángulo (T)">△</button>
    <button class="tool-btn"        data-tool="arrow"     title="Flecha (A)">→</button>
    <div class="tool-sep"></div>
    <button class="tool-btn"        data-tool="text"      title="Texto (X)">T</button>
    <div class="tool-sep"></div>
    <button class="tool-btn"        data-tool="select"    title="Seleccionar (S)">⊹</button>
    <button class="tool-btn"        data-tool="pan"       title="Mover (Space)">✋</button>
  </div>

  <!-- PROPERTIES -->
  <div id="props">
    <div class="prop-section">
      <div class="prop-label">Color</div>
      <div class="color-grid" id="color-grid"></div>
      <input type="color" id="color-custom" value="#7c3aed" title="Color personalizado"/>
    </div>

    <div class="prop-section" id="section-fill">
      <div class="prop-label">Relleno</div>
      <div class="prop-row">
        <button class="prop-btn active" id="fill-none">Sin relleno</button>
        <button class="prop-btn" id="fill-solid">Sólido</button>
      </div>
    </div>

    <div class="prop-section">
      <div class="prop-label">Grosor</div>
      <div class="slider-wrap">
        <input type="range" class="prop-slider" id="stroke-slider" min="1" max="40" value="3"/>
        <span class="slider-val" id="stroke-val">3</span>
      </div>
    </div>

    <div class="prop-section">
      <div class="prop-label">Opacidad</div>
      <div class="slider-wrap">
        <input type="range" class="prop-slider" id="opacity-slider" min="10" max="100" value="100"/>
        <span class="slider-val" id="opacity-val">100%</span>
      </div>
    </div>

    <div class="prop-section" id="section-text-props">
      <div class="prop-label">Texto</div>
      <input type="number" id="font-size-input" value="18" min="8" max="120" placeholder="Tamaño"/>
      <div class="prop-row" style="margin-top:6px">
        <button class="prop-btn" id="font-bold">B</button>
        <button class="prop-btn" id="font-italic">I</button>
      </div>
    </div>

    <div class="prop-section">
      <div class="prop-label">Fondo canvas</div>
      <div class="prop-row">
        <button class="prop-btn active" id="bg-transparent">Transp.</button>
        <button class="prop-btn" id="bg-white">Blanco</button>
        <button class="prop-btn" id="bg-dark">Oscuro</button>
      </div>
    </div>
  </div>

  <!-- CANVAS -->
  <div id="canvas-wrap">
    <canvas id="canvas-bg"></canvas>
    <canvas id="canvas-main"></canvas>
    <canvas id="canvas-overlay"></canvas>
    <div id="shapes-layer"></div>
    <div id="textos-layer"></div>
    <div id="images-layer"></div>
    <textarea id="text-input" rows="1"></textarea>
  </div>
</div>

<!-- Menú contextual -->
<div id="ctx-menu">
  <div class="ctx-item" data-action="frente">⬆ Traer al frente</div>
  <div class="ctx-item" data-action="adelantar">↑ Adelantar</div>
  <div class="ctx-item" data-action="atrasar">↓ Atrasar</div>
  <div class="ctx-item" data-action="fondo">⬇ Enviar al fondo</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" data-action="duplicar">⧉ Duplicar</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item danger" data-action="eliminar">✕ Eliminar</div>
</div>

<div id="props-float">
  <!-- Color -->
  <div style="display:flex;gap:6px;align-items:center">
    <span style="font-size:10px;color:var(--muted)">Color</span>
    <div id="pf-colors" style="display:flex;gap:3px;flex-wrap:wrap;max-width:180px"></div>
  </div>
  <div style="width:1px;height:28px;background:var(--border)"></div>
  <!-- Grosor -->
  <div style="display:flex;gap:6px;align-items:center">
    <span style="font-size:10px;color:var(--muted)">Grosor</span>
    <input type="range" id="pf-size" min="1" max="30" value="3" style="width:70px;accent-color:var(--accent)"/>
  </div>
  <div style="width:1px;height:28px;background:var(--border)"></div>
  <!-- Opacidad -->
  <div style="display:flex;gap:6px;align-items:center">
    <span style="font-size:10px;color:var(--muted)">Opacidad</span>
    <input type="range" id="pf-opacity" min="0" max="100" value="100" style="width:70px;accent-color:var(--accent)"/>
  </div>
  <div style="width:1px;height:28px;background:var(--border)"></div>
  <!-- Acciones -->
  <button onclick="document.getElementById('btn-undo').click()" class="top-btn" style="padding:0 10px;height:28px">↩</button>
  <button onclick="document.getElementById('btn-redo').click()" class="top-btn" style="padding:0 10px;height:28px">↪</button>
  <button onclick="document.getElementById('btn-save').click()" class="top-btn" style="padding:0 10px;height:28px">💾</button>
  <button onclick="document.getElementById('btn-clear').click()" class="top-btn danger" style="padding:0 10px;height:28px">🗑</button>
</div>

<script>
// ═══════════════════════════════════════
//  STATE
// ═══════════════════════════════════════
const COLORS = [
  '#ffffff','#000000','#ef4444','#f97316','#f59e0b','#84cc16',
  '#10b981','#06b6d4','#3b82f6','#7c3aed','#ec4899','#6b7280',
  '#fca5a5','#fed7aa','#fde68a','#bbf7d0','#a5f3fc','#bfdbfe',
  '#ddd6fe','#fbcfe8','#374151','#1e3a5f'
];

let tool = 'pencil';
let strokeColor = '#7c3aed';
let strokes = [];
let currentStroke = null;
let fillMode = 'none';
let strokeWidth = 3;
let opacity = 1.0;
let fontSize = 18;
let fontBold = false;
let fontItalic = false;
let bgMode = 'transparent';

let zoom = 1.0;
let panX = 0, panY = 0;
let isPanning = false;
let panStart = { x: 0, y: 0 };

let isDrawing = false;
let startX = 0, startY = 0;
let lastX = 0, lastY = 0;

let undoStack = [];
let redoStack = [];
const MAX_UNDO = 40;

// Images
let images = [];
let selectedImg = null;
let draggingImg = null;
let resizingImg = null;
let resizeHandle = null;
let dragOffset = { x: 0, y: 0 };
let resizeStart = {};

// Shapes
let shapes = [];
let selectedShape = null;
let draggingShape = null;

// ═══════════════════════════════════════
//  CANVAS SETUP
// ═══════════════════════════════════════
const wrap     = document.getElementById('canvas-wrap');
const canvasBg = document.getElementById('canvas-bg');
const canvas   = document.getElementById('canvas-main');
const overlay  = document.getElementById('canvas-overlay');
const ctxBg    = canvasBg.getContext('2d');
const ctx      = canvas.getContext('2d');
const ctxOv    = overlay.getContext('2d');

function resizeCanvases() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  [canvasBg, canvas, overlay].forEach(c => { c.width = w; c.height = h; });
  drawBg();
  redrawAll();
}

function drawBg() {
  ctxBg.clearRect(0, 0, canvasBg.width, canvasBg.height);
  if (bgMode === 'white') { ctxBg.fillStyle = '#ffffff'; ctxBg.fillRect(0, 0, canvasBg.width, canvasBg.height); }
  else if (bgMode === 'dark') { ctxBg.fillStyle = '#0d0d14'; ctxBg.fillRect(0, 0, canvasBg.width, canvasBg.height); }
}

function renderStrokes() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  strokes.forEach(s => {
    if (s.points.length < 2) return;
    ctx.save();
    ctx.translate(panX, panY);
    ctx.scale(zoom, zoom);
    ctx.strokeStyle = s.color;
    ctx.lineWidth   = s.width;
    ctx.globalAlpha = s.opacity;
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';
    if (s.eraser) {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.globalAlpha = 1;
    } else {
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.beginPath();
    ctx.moveTo(s.points[0].x, s.points[0].y);
    for (let i = 1; i < s.points.length; i++)
      ctx.lineTo(s.points[i].x, s.points[i].y);
    ctx.stroke();
    ctx.restore();
  });
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

// ═══════════════════════════════════════
//  UNDO / REDO
// ═══════════════════════════════════════
function saveState() {
  const imgs  = JSON.parse(JSON.stringify(images));
  const shps  = JSON.parse(JSON.stringify(shapes));
  const txts  = JSON.parse(JSON.stringify(textos));
  const strs  = JSON.parse(JSON.stringify(strokes));
  undoStack.push({ imgs, shapes: shps, textos: txts, strokes: strs });
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  redoStack = [];
}

function restoreState(state) {
  images  = state.imgs    ?? [];
  shapes  = state.shapes  ?? [];
  textos  = state.textos  ?? [];
  strokes = state.strokes ?? [];
  renderStrokes();
  renderImages();
  renderShapes();
  renderTextos();
}

function undo() {
  if (undoStack.length === 0) return;
  const strs  = JSON.parse(JSON.stringify(strokes));
  const imgs  = JSON.parse(JSON.stringify(images));
  const shps  = JSON.parse(JSON.stringify(shapes));
  const txts  = JSON.parse(JSON.stringify(textos));
  redoStack.push({ imgs, shapes: shps, textos: txts, strokes: strs });
  const state = undoStack.pop();
  restoreState(state);
}

function redo() {
  if (redoStack.length === 0) return;
  const strs  = JSON.parse(JSON.stringify(strokes));
  const imgs  = JSON.parse(JSON.stringify(images));
  const shps  = JSON.parse(JSON.stringify(shapes));
  const txts  = JSON.parse(JSON.stringify(textos));
  undoStack.push({ imgs, shapes: shps, textos: txts, strokes: strs });
  const state = redoStack.pop();
  restoreState(state);
}

// ═══════════════════════════════════════
//  COORDINATE TRANSFORM
// ═══════════════════════════════════════
function screenToCanvas(x, y) {
  return { x: (x - panX) / zoom, y: (y - panY) / zoom };
}

function applyTransform(c) {
  c.save();
  c.translate(panX, panY);
  c.scale(zoom, zoom);
}

function redrawAll() {
  // Just redraw bg, main canvas handles itself
  drawBg();
}

// ═══════════════════════════════════════
//  DRAW HELPERS
// ═══════════════════════════════════════
function setCtxStyle(c) {
  c.strokeStyle = strokeColor;
  c.fillStyle   = strokeColor;
  c.lineWidth   = strokeWidth / zoom;
  c.lineCap     = 'round';
  c.lineJoin    = 'round';
  c.globalAlpha = opacity;
}

function drawShape(c, tool, x1, y1, x2, y2) {
  setCtxStyle(c);
  c.beginPath();
  switch (tool) {
    case 'line':
      c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); break;
    case 'rect':
      if (fillMode === 'solid') { c.fillRect(x1, y1, x2-x1, y2-y1); }
      c.strokeRect(x1, y1, x2-x1, y2-y1); break;
    case 'circle':
      const rx = Math.abs(x2-x1)/2, ry = Math.abs(y2-y1)/2;
      const cx = x1 + (x2-x1)/2, cy = y1 + (y2-y1)/2;
      c.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2);
      if (fillMode === 'solid') c.fill();
      c.stroke(); break;
    case 'triangle':
      c.moveTo((x1+x2)/2, y1); c.lineTo(x2, y2); c.lineTo(x1, y2); c.closePath();
      if (fillMode === 'solid') c.fill();
      c.stroke(); break;
    case 'arrow':
      drawArrow(c, x1, y1, x2, y2); break;
  }
  c.globalAlpha = 1;
}

function drawArrow(c, x1, y1, x2, y2) {
  const headLen = Math.max(10, strokeWidth * 3) / zoom;
  const angle = Math.atan2(y2-y1, x2-x1);
  c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
  c.beginPath();
  c.moveTo(x2, y2);
  c.lineTo(x2 - headLen*Math.cos(angle-Math.PI/6), y2 - headLen*Math.sin(angle-Math.PI/6));
  c.moveTo(x2, y2);
  c.lineTo(x2 - headLen*Math.cos(angle+Math.PI/6), y2 - headLen*Math.sin(angle+Math.PI/6));
  c.stroke();
}

// ═══════════════════════════════════════
//  FILL TOOL
// ═══════════════════════════════════════
function floodFill(x, y) {
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imgData.data;
  const idx = (Math.round(y) * canvas.width + Math.round(x)) * 4;
  const target = [data[idx], data[idx+1], data[idx+2], data[idx+3]];

  const fill = hexToRgba(strokeColor, opacity);
  if (target[0]===fill[0] && target[1]===fill[1] && target[2]===fill[2]) return;

  const stack = [[Math.round(x), Math.round(y)]];
  const visited = new Set();

  function match(i) {
    return Math.abs(data[i]-target[0]) < 30 && Math.abs(data[i+1]-target[1]) < 30
        && Math.abs(data[i+2]-target[2]) < 30 && Math.abs(data[i+3]-target[3]) < 30;
  }

  while (stack.length) {
    const [px, py] = stack.pop();
    if (px < 0 || px >= canvas.width || py < 0 || py >= canvas.height) continue;
    const key = py * canvas.width + px;
    if (visited.has(key)) continue;
    visited.add(key);
    const i = key * 4;
    if (!match(i)) continue;
    data[i]=fill[0]; data[i+1]=fill[1]; data[i+2]=fill[2]; data[i+3]=fill[3];
    stack.push([px+1,py],[px-1,py],[px,py+1],[px,py-1]);
  }
  ctx.putImageData(imgData, 0, 0);
}

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r, g, b, Math.round(a*255)];
}

// ═══════════════════════════════════════
//  TEXT TOOL
// ═══════════════════════════════════════
const textInput = document.getElementById('text-input');

function commitText() {
  const val = textInput.value.trim();
  if (val) {
    ctx.save();
    ctx.translate(panX, panY);
    ctx.scale(zoom, zoom);
    const font = `${fontItalic?'italic ':''  }${fontBold?'bold ':''  }${fontSize}px 'Segoe UI', sans-serif`;
    ctx.font = font;
    ctx.fillStyle = strokeColor;
    ctx.globalAlpha = opacity;
    const lines = val.split('\n');
    lines.forEach((line, i) => ctx.fillText(line, textX, textY + i * fontSize * 1.3));
    ctx.restore();
    saveState();
  }
  textInput.style.display = 'none';
  textInput.value = '';
  textActive = false;
}

//  IMAGES
// ═══════════════════════════════════════
function addImage(src) {
  const img = { src, x: 100, y: 100, w: 200, h: 150, id: Date.now(), rotation: 0 };
  images.push(img);
  renderImages();
  saveState();
}

function renderImages() {
  const layer = document.getElementById('images-layer');
  layer.innerHTML = '';
  images.forEach(img => {
    const div = document.createElement('div');
    div.className = 'img-obj' + (selectedImg === img.id ? ' selected' : '');
    div.style.left   = (img.x * zoom + panX) + 'px';
    div.style.top    = (img.y * zoom + panY) + 'px';
    div.style.width  = (img.w * zoom) + 'px';
    div.style.height = (img.h * zoom) + 'px';
    div.dataset.id = img.id;
    div.style.transform = `rotate(${img.rotation}deg)`;
    div.style.transformOrigin = 'center center';

    const el = document.createElement('img');
    el.src = img.src;
    div.appendChild(el);

    // Drag
    div.addEventListener('mousedown', e => {
      if (e.target.classList.contains('resize-handle')) return;
      const rotHandle = document.createElement('div');
      rotHandle.className = 'rot-handle';
      rotHandle.style.cssText = `...`;
      if (tool !== 'select') return;
      e.stopPropagation();
      selectedImg = img.id;
      draggingImg = img.id;
      dragOffset = { x: e.clientX - div.offsetLeft, y: e.clientY - div.offsetTop };
      renderImages();
    });

    if (selectedImg === img.id) {
      // Handles de resize
      ['tl','tr','bl','br'].forEach(pos => {
        const h = document.createElement('div');
        h.className = `resize-handle ${pos}`;
        h.dataset.handle = pos;
        h.dataset.id = img.id;

        // Listener directo en cada handle
        h.addEventListener('mousedown', e => {
          e.stopPropagation();
          resizingImg  = img.id;
          resizeHandle = pos;
          const imgObj = images.find(i => i.id == img.id);
          resizeStart  = {
            mx: e.clientX, my: e.clientY,
            x: imgObj.x, y: imgObj.y, w: imgObj.w, h: imgObj.h
          };
        });

        div.appendChild(h);
      });

      // Handle de rotación
      const rotHandle = document.createElement('div');
      rotHandle.style.cssText = `
        position:absolute; top:-28px; left:50%; transform:translateX(-50%);
        width:18px; height:18px; border-radius:50%;
        background:rgba(124,58,237,0.8); border:2px solid white;
        cursor:grab; z-index:10;
      `;
      rotHandle.addEventListener('mousedown', e => {
        e.stopPropagation();
        const imgObj     = images.find(i => i.id === img.id);
        const rect       = div.getBoundingClientRect();
        const cx         = rect.left + rect.width  / 2;
        const cy         = rect.top  + rect.height / 2;
        const startAngle = Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI;
        const startRot   = imgObj.rotation;
        const onMove = e => {
          const angle = Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI;
          imgObj.rotation = startRot + (angle - startAngle);
          div.style.transform = `rotate(${imgObj.rotation}deg)`;
        };
        const onUp = () => {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          saveState();
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
      div.appendChild(rotHandle);

      // Botón eliminar
      const delBtn = document.createElement('button');
      delBtn.textContent = '✕';
      delBtn.style.cssText = `
        position:absolute; top:-12px; right:-12px;
        width:22px; height:22px; border-radius:50%;
        background:#ef4444; border:none; color:white;
        font-size:12px; cursor:pointer; display:flex;
        align-items:center; justify-content:center;
        z-index:10; line-height:1;
      `;
      delBtn.addEventListener('mousedown', e => {
        e.stopPropagation();
        eliminarImagenSeleccionada();
      });
      div.appendChild(delBtn);
    }

    layer.appendChild(div);
  });
}

function renderShapes() {
  const layer = document.getElementById('shapes-layer');
  if (!layer) return;
  layer.innerHTML = '';

  for (const s of shapes) {
    const div = document.createElement('div');
    div.className = 'shape-obj' + (selectedShape === s.id ? ' selected' : '');
    div.dataset.id = s.id;
    const esLinea = s.tipo === 'line' || s.tipo === 'arrow';

    if (esLinea) {
      const sx1 = s.x1 * zoom + panX, sy1 = s.y1 * zoom + panY;
      const sx2 = s.x2 * zoom + panX, sy2 = s.y2 * zoom + panY;
      const minX = Math.min(sx1, sx2) - 8;
      const minY = Math.min(sy1, sy2) - 8;
      div.style.left   = minX + 'px';
      div.style.top    = minY + 'px';
      div.style.width  = (Math.abs(sx2 - sx1) + 16) + 'px';
      div.style.height = (Math.abs(sy2 - sy1) + 16) + 'px';

      div.addEventListener('mousedown', e => {
        if (e.target.classList.contains('pt-handle')) return;
        if (tool !== 'select') return;
        e.stopPropagation();
        selectedShape = s.id; selectedImg = null;
        draggingShape = s.id;
        dragShapeOffset = { x: e.clientX - div.offsetLeft, y: e.clientY - div.offsetTop };
        renderShapes(); renderImages();
      });

      if (selectedShape === s.id) {
        [[sx1,sy1,'x1','y1'],[sx2,sy2,'x2','y2']].forEach(([sx,sy,kx,ky]) => {
          const h = document.createElement('div');
          h.className = 'pt-handle';
          h.style.cssText = `position:absolute;left:${sx-minX-6}px;top:${sy-minY-6}px;
            width:12px;height:12px;border-radius:50%;background:white;
            border:2px solid var(--accent);cursor:crosshair;z-index:10;`;
          h.addEventListener('mousedown', e => {
            e.stopPropagation();
            const onMove = e => {
              const r = canvas.getBoundingClientRect();
              const pos = screenToCanvas(e.clientX - r.left, e.clientY - r.top);
              s[kx] = pos.x; s[ky] = pos.y;
              redrawAll(); renderShapes();
            };
            const onUp = () => {
              document.removeEventListener('mousemove', onMove);
              document.removeEventListener('mouseup', onUp);
              saveState();
            };
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
          });
          div.appendChild(h);
        });

        const delBtn = document.createElement('button');
        delBtn.textContent = '✕';
        delBtn.style.cssText = `position:absolute;top:-12px;right:-12px;
          width:22px;height:22px;border-radius:50%;background:#ef4444;
          border:none;color:white;font-size:12px;cursor:pointer;z-index:10;`;
        delBtn.addEventListener('mousedown', e => { e.stopPropagation(); eliminarShapeSeleccionada(); });
        div.appendChild(delBtn);
      }

    } else {
      const sx = s.x * zoom + panX, sy = s.y * zoom + panY;
      div.style.left   = sx + 'px';
      div.style.top    = sy + 'px';
      div.style.width  = Math.abs(s.w * zoom) + 'px';
      div.style.height = Math.abs(s.h * zoom) + 'px';
      div.style.transform = `rotate(${s.rotation ?? 0}deg)`;
      div.style.transformOrigin = 'center center';

      div.addEventListener('mousedown', e => {
        if (e.target.classList.contains('resize-handle')) return;
        if (e.target.classList.contains('rot-handle')) return;
        if (tool !== 'select') return;
        e.stopPropagation();
        selectedShape = s.id; selectedImg = null;
        draggingShape = s.id;
        dragShapeOffset = { x: e.clientX - div.offsetLeft, y: e.clientY - div.offsetTop };
        renderShapes(); renderImages();
      });

      if (selectedShape === s.id) {
        ['tl','tr','bl','br'].forEach(pos => {
          const h = document.createElement('div');
          h.className = `resize-handle ${pos}`;
          h.addEventListener('mousedown', e => {
            e.stopPropagation();
            resizingShape = s.id; resizeShapeHandle = pos;
            resizeShapeStart = { mx: e.clientX, my: e.clientY, x: s.x, y: s.y, w: s.w, h: s.h };
          });
          div.appendChild(h);
        });

        const rotHandle = document.createElement('div');
        rotHandle.className = 'rot-handle';
        rotHandle.style.cssText = `position:absolute;top:-28px;left:50%;transform:translateX(-50%);
          width:18px;height:18px;border-radius:50%;
          background:rgba(124,58,237,0.8);border:2px solid white;cursor:grab;z-index:10;`;
        rotHandle.addEventListener('mousedown', e => {
          e.stopPropagation();
          const rect = div.getBoundingClientRect();
          const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
          const startAngle = Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI;
          const startRot = s.rotation ?? 0;
          const onMove = e => {
            s.rotation = startRot + (Math.atan2(e.clientY-cy, e.clientX-cx)*180/Math.PI - startAngle);
            div.style.transform = `rotate(${s.rotation}deg)`;
            redrawAll();
          };
          const onUp = () => {
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
            saveState();
          };
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
        });
        div.appendChild(rotHandle);

        const delBtn = document.createElement('button');
        delBtn.textContent = '✕';
        delBtn.style.cssText = `position:absolute;top:-12px;right:-12px;
          width:22px;height:22px;border-radius:50%;background:#ef4444;
          border:none;color:white;font-size:12px;cursor:pointer;z-index:10;`;
        delBtn.addEventListener('mousedown', e => { e.stopPropagation(); eliminarShapeSeleccionada(); });
        div.appendChild(delBtn);
      }
    }

    layer.appendChild(div);
  }
}

function renderTextos() {
  const layer = document.getElementById('textos-layer');
  if (!layer) return;
  layer.innerHTML = '';

  for (const t of textos) {
    const div = document.createElement('div');
    div.className = 'texto-obj' + (selectedTexto === t.id ? ' selected' : '');
    div.dataset.id = t.id;
    div.style.left   = (t.x * zoom + panX) + 'px';
    div.style.top    = (t.y * zoom + panY) + 'px';
    div.style.width  = (t.w * zoom) + 'px';
    div.style.height = (t.h * zoom) + 'px';
    div.style.color  = t.color;
    div.style.fontSize = (t.fontSize * zoom) + 'px';
    div.style.fontWeight = t.bold   ? 'bold'   : 'normal';
    div.style.fontStyle  = t.italic ? 'italic' : 'normal';
    div.style.transform  = `rotate(${t.rotation ?? 0}deg)`;
    div.style.transformOrigin = 'center center';

    const ta = document.createElement('textarea');
    ta.className = 'texto-content';
    ta.value     = t.texto;
    ta.style.fontSize   = (t.fontSize * zoom) + 'px';
    ta.style.fontWeight = t.bold   ? 'bold'   : 'normal';
    ta.style.fontStyle  = t.italic ? 'italic' : 'normal';
    ta.style.color      = t.color;
    ta.style.caretColor = t.color;

    ta.addEventListener('input', () => {
      t.texto = ta.value;
    });
    ta.addEventListener('mousedown', e => e.stopPropagation());
    ta.addEventListener('focus', () => {
      div.classList.add('editing');
      window._editandoTexto = true;
    });
    ta.addEventListener('blur', () => {
      div.classList.remove('editing');
      window._editandoTexto = false;
      saveState();
    });
    

    div.appendChild(ta);

    // Drag
    div.addEventListener('mousedown', e => {
      if (e.target === ta) return;
      if (e.target.classList.contains('resize-handle')) return;
      if (e.target.classList.contains('rot-handle')) return;
      if (tool !== 'select') return;
      e.stopPropagation();
      selectedTexto = t.id;
      selectedShape = null;
      selectedImg   = null;
      draggingTexto = t.id;
      dragTextoOffset = { x: e.clientX - div.offsetLeft, y: e.clientY - div.offsetTop };
      renderTextos();
    });

    if (selectedTexto === t.id) {
      // Handles resize
      ['tl','tr','bl','br'].forEach(pos => {
        const h = document.createElement('div');
        h.className = `resize-handle ${pos}`;
        h.addEventListener('mousedown', e => {
          e.stopPropagation();
          // Usar mismo sistema de resize que shapes
          resizingShape     = 'texto_' + t.id;
          resizeShapeHandle = pos;
          resizeShapeStart  = { mx: e.clientX, my: e.clientY, x: t.x, y: t.y, w: t.w, h: t.h };
        });
        div.appendChild(h);
      });

      // Handle rotación
      const rotHandle = document.createElement('div');
      rotHandle.className = 'rot-handle';
      rotHandle.style.cssText = `
        position:absolute; top:-28px; left:50%; transform:translateX(-50%);
        width:18px; height:18px; border-radius:50%;
        background:rgba(124,58,237,0.8); border:2px solid white;
        cursor:grab; z-index:10;
      `;
      rotHandle.addEventListener('mousedown', e => {
        e.stopPropagation();
        const rect = div.getBoundingClientRect();
        const cx = rect.left + rect.width  / 2;
        const cy = rect.top  + rect.height / 2;
        const startAngle = Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI;
        const startRot   = t.rotation ?? 0;
        const onMove = e => {
          t.rotation = startRot + (Math.atan2(e.clientY-cy, e.clientX-cx)*180/Math.PI - startAngle);
          div.style.transform = `rotate(${t.rotation}deg)`;
        };
        const onUp = () => {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          saveState();
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
      div.appendChild(rotHandle);

      // Botón eliminar
      const delBtn = document.createElement('button');
      delBtn.textContent = '✕';
      delBtn.style.cssText = `
        position:absolute; top:-12px; right:-12px;
        width:22px; height:22px; border-radius:50%;
        background:#ef4444; border:none; color:white;
        font-size:12px; cursor:pointer; z-index:10;
      `;
      delBtn.addEventListener('mousedown', e => {
        e.stopPropagation();
        saveState();
        textos = textos.filter(tx => tx.id !== t.id);
        selectedTexto = null;
        renderTextos();
      });
      div.appendChild(delBtn);
    }

    layer.appendChild(div);
  }
}

function eliminarShapeSeleccionada() {
  if (!selectedShape) return;
  saveState();
  shapes = shapes.filter(s => s.id !== selectedShape);
  selectedShape = null;
  redrawAll();
  renderShapes();
  renderTextos();
  renderImages();
}

function eliminarImagenSeleccionada() {
  if (!selectedImg) return;
  saveState();
  images = images.filter(img => img.id !== selectedImg);
  selectedImg = null;
  renderImages();
  renderShapes();
  renderTextos();
}

function redrawAll() {
  // Limpiar canvas de shapes
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // Redibujar canvas base
  const base = canvasBg;
  ctx.drawImage(base, 0, 0);

  // Dibujar shapes
  ctx.save();
  ctx.translate(panX, panY);
  ctx.scale(zoom, zoom);
  for (const s of shapes) {
    ctx.save();
    ctx.globalAlpha  = s.opacity;
    ctx.strokeStyle  = s.color;
    ctx.fillStyle    = s.fillColor ?? s.color;
    ctx.lineWidth    = s.size;
    ctx.lineCap      = 'round';
    ctx.lineJoin     = 'round';

    // Transformar desde el centro
    const cx = s.x + s.w / 2;
    const cy = s.y + s.h / 2;
    ctx.translate(cx, cy);
    ctx.rotate((s.rotation ?? 0) * Math.PI / 180);
    ctx.translate(-cx, -cy);

    drawShapeObj(ctx, s);
    ctx.restore();
  }
  ctx.restore();

  // Redibujar imágenes
  renderImages();
  renderTextos();
  renderShapes();
}

function drawShapeObj(c, s) {
  c.beginPath();
  switch (s.tipo) {
    case 'rect':
      if (s.fillMode === 'solid') c.fillRect(s.x, s.y, s.w, s.h);
      c.strokeRect(s.x, s.y, s.w, s.h);
      break;
    case 'circle': {
      const rx = Math.abs(s.w) / 2, ry = Math.abs(s.h) / 2;
      const cx = s.x + s.w / 2, cy = s.y + s.h / 2;
      c.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      if (s.fillMode === 'solid') c.fill();
      c.stroke();
      break;
    }
    case 'triangle':
      c.moveTo(s.x + s.w / 2, s.y);
      c.lineTo(s.x + s.w, s.y + s.h);
      c.lineTo(s.x, s.y + s.h);
      c.closePath();
      if (s.fillMode === 'solid') c.fill();
      c.stroke();
      break;
    case 'line':
      c.moveTo(s.x1, s.y1); c.lineTo(s.x2, s.y2);
      c.stroke();
      break;
    case 'arrow':
      drawArrow(c, s.x1, s.y1, s.x2, s.y2);
      break;
  }
}

// ═══════════════════════════════════════
//  CANVAS EVENTS
// ═══════════════════════════════════════
canvas.addEventListener('mousedown', e => {
  if (tool === 'pan') { isPanning = true; panStart = { x: e.clientX - panX, y: e.clientY - panY }; return; }
  if (tool === 'select') {
    selectedImg   = null;
    selectedShape = null;
    selectedTexto = null;
    renderImages();
    renderShapes();
    renderTextos();
    return;
  }
  if (tool === 'text') {
    selectedShape = null;
    selectedImg   = null;
    selectedTexto = null;
    renderShapes(); renderImages(); renderTextos();
    const p = getCanvasPos(e);
    startX = p.x; startY = p.y;
    isDrawing = true;
    return;
  }
  if (tool === 'fill') {
    saveState();
    const pos = getCanvasPos(e);
    floodFill(pos.x * zoom + panX, pos.y * zoom + panY); // fill on screen coords
    return;
  }

  isDrawing = true;
  const pos = getCanvasPos(e);
  startX = pos.x; startY = pos.y;
  lastX  = pos.x; lastY  = pos.y;

  if (tool === 'pencil' || tool === 'eraser') {
    saveState();
    currentStroke = {
      color:   strokeColor,
      width:   strokeWidth,
      opacity: opacity,
      eraser:  tool === 'eraser',
      points:  [{ x: startX, y: startY }]
    };
  }
});

canvas.addEventListener('mousemove', e => {
  if (isPanning) { panX = e.clientX - panStart.x; panY = e.clientY - panStart.y; drawBg(); renderStrokes(); renderImages(); return; }
  if (!isDrawing) return;

  const pos = getCanvasPos(e);

  if (tool === 'pencil' || tool === 'eraser') {
    if (!currentStroke) return;
    currentStroke.points.push({ x: pos.x, y: pos.y });
    lastX = pos.x; lastY = pos.y;

    // Redibujar todos los trazos + el trazo actual en progreso
    renderStrokes();
    if (currentStroke.points.length >= 2) {
      ctx.save();
      ctx.translate(panX, panY);
      ctx.scale(zoom, zoom);
      ctx.strokeStyle = currentStroke.color;
      ctx.lineWidth   = currentStroke.width;
      ctx.globalAlpha = currentStroke.opacity;
      ctx.lineCap     = 'round';
      ctx.lineJoin    = 'round';
      if (currentStroke.eraser) {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.globalAlpha = 1;
      }
      ctx.beginPath();
      ctx.moveTo(currentStroke.points[0].x, currentStroke.points[0].y);
      for (let i = 1; i < currentStroke.points.length; i++)
        ctx.lineTo(currentStroke.points[i].x, currentStroke.points[i].y);
      ctx.stroke();
      ctx.restore();
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
    return;
  } else if (tool === 'text') {
    ctxOv.clearRect(0, 0, overlay.width, overlay.height);
    ctxOv.save();
    ctxOv.translate(panX, panY);
    ctxOv.scale(zoom, zoom);
    ctxOv.strokeStyle = strokeColor;
    ctxOv.lineWidth   = 1 / zoom;
    ctxOv.setLineDash([4 / zoom, 4 / zoom]);
    ctxOv.strokeRect(
      Math.min(startX, pos.x), Math.min(startY, pos.y),
      Math.abs(pos.x - startX), Math.abs(pos.y - startY)
    );
    ctxOv.restore();
  } else {
    ctxOv.clearRect(0, 0, overlay.width, overlay.height);
    ctxOv.save();
    ctxOv.translate(panX, panY);
    ctxOv.scale(zoom, zoom);
    drawShape(ctxOv, tool, startX, startY, pos.x, pos.y);
    ctxOv.restore();
  }
});

window.addEventListener('mouseup', e => {
  // Image drag
  if (draggingImg) {
    draggingImg = null;
    saveState();
    return;
  }
  // Image resize
  if (resizingImg) {
    resizingImg = null;
    resizeHandle = null;
    saveState();
    return;
  }

  if (draggingShape) { draggingShape = null; saveState(); return; }
  if (resizingShape) { resizingShape = null; resizeShapeHandle = null; saveState(); return; }
  if (draggingTexto) { draggingTexto = null; saveState(); return; }

  if (isPanning) { isPanning = false; return; }
  if (tool === 'text' && isDrawing) {
    isDrawing = false;
    const rect = canvas.getBoundingClientRect();
    const pos  = screenToCanvas(e.clientX - rect.left, e.clientY - rect.top);
    ctxOv.clearRect(0, 0, overlay.width, overlay.height);
    const tw = Math.abs(pos.x - startX);
    const th = Math.abs(pos.y - startY);
    const t = {
      id:       Date.now(),
      texto:    '',
      x:        Math.min(startX, pos.x),
      y:        Math.min(startY, pos.y),
      w:        tw < 20 ? 200 / zoom : tw,
      h:        th < 20 ? 80  / zoom : th,
      color:    strokeColor,
      fontSize: fontSize,
      bold:     fontBold,
      italic:   fontItalic,
      rotation: 0
    };
    textos.push(t);
    selectedTexto = t.id;
    saveState();
    renderTextos();
    setTimeout(() => {
      document.getElementById('textos-layer')
        ?.querySelector(`[data-id="${t.id}"] textarea`)?.focus();
    }, 0);
    return;
  }
  if (!isDrawing) return;
  isDrawing = false;

  const rect = canvas.getBoundingClientRect();
  const ex = e.clientX - rect.left;
  const ey = e.clientY - rect.top;
  const pos = screenToCanvas(ex, ey);

  ctxOv.clearRect(0, 0, overlay.width, overlay.height);

  if ((tool === 'pencil' || tool === 'eraser') && currentStroke) {
    if (currentStroke.points.length > 1)
      strokes.push(currentStroke);
    currentStroke = null;
    isDrawing = false;
    return;
  }
  if (!['pencil','eraser'].includes(tool)) {
    if (['rect','circle','triangle','line','arrow'].includes(tool)) {
      ctxOv.clearRect(0, 0, overlay.width, overlay.height);
      if (Math.abs(pos.x - startX) > 3 || Math.abs(pos.y - startY) > 3) {
        saveState();
        shapes.push({
          id:       Date.now(),
          tipo:     tool,
          // Flechas y líneas: puntos directos
          ...((['line','arrow'].includes(tool)) ? {
            x1: startX, y1: startY,
            x2: pos.x,  y2: pos.y,
          } : {
            x:  Math.min(startX, pos.x),
            y:  Math.min(startY, pos.y),
            w:  Math.abs(pos.x - startX),
            h:  Math.abs(pos.y - startY),
          }),
          color:    strokeColor,
          fillColor: strokeColor,
          fillMode: fillMode,
          size:     strokeWidth,
          opacity:  opacity,
          rotation: 0
        });
        redrawAll();
      }
    } else {
      ctx.save();
      ctx.translate(panX, panY);
      ctx.scale(zoom, zoom);
      drawShape(ctx, tool, startX, startY, pos.x, pos.y);
      ctx.restore();
      saveState();
    }
  }
});

// Image drag on window
window.addEventListener('mousemove', e => {
  if (draggingImg) {
    const layer = document.getElementById('images-layer');
    const div = layer.querySelector(`[data-id="${draggingImg}"]`);
    if (!div) return;
    const newLeft = e.clientX - dragOffset.x;
    const newTop  = e.clientY - dragOffset.y;
    div.style.left = newLeft + 'px';
    div.style.top  = newTop  + 'px';
    const img = images.find(i => i.id == draggingImg);
    if (img) { img.x = (newLeft - panX) / zoom; img.y = (newTop - panY) / zoom; }
  }
  if (resizingImg && resizeHandle) {
    const img = images.find(i => i.id == resizingImg);
    if (!img) return;
    const dx = (e.clientX - resizeStart.mx) / zoom;
    const dy = (e.clientY - resizeStart.my) / zoom;
    if (resizeHandle === 'br') { img.w = Math.max(20, resizeStart.w + dx); img.h = Math.max(20, resizeStart.h + dy); }
    if (resizeHandle === 'bl') { img.x = resizeStart.x + dx; img.w = Math.max(20, resizeStart.w - dx); img.h = Math.max(20, resizeStart.h + dy); }
    if (resizeHandle === 'tr') { img.y = resizeStart.y + dy; img.w = Math.max(20, resizeStart.w + dx); img.h = Math.max(20, resizeStart.h - dy); }
    if (resizeHandle === 'tl') { img.x = resizeStart.x + dx; img.y = resizeStart.y + dy; img.w = Math.max(20, resizeStart.w - dx); img.h = Math.max(20, resizeStart.h - dy); }
    renderImages();
  }
  if (draggingShape) {
    const s     = shapes.find(s => s.id == draggingShape);
    const layer = document.getElementById('shapes-layer');
    const div   = layer.querySelector(`[data-id="${draggingShape}"]`);
    if (!s || !div) return;
    const newLeft = e.clientX - dragShapeOffset.x;
    const newTop  = e.clientY - dragShapeOffset.y;
    div.style.left = newLeft + 'px';
    div.style.top  = newTop  + 'px';

    if (s.tipo === 'line' || s.tipo === 'arrow') {
      const dx = (newLeft - (Math.min(s.x1, s.x2) * zoom + panX - 8)) / zoom;
      const dy = (newTop  - (Math.min(s.y1, s.y2) * zoom + panY - 8)) / zoom;
      s.x1 += dx; s.y1 += dy;
      s.x2 += dx; s.y2 += dy;
    } else {
      s.x = (newLeft - panX) / zoom;
      s.y = (newTop  - panY) / zoom;
    }
    redrawAll();
  }
  if (resizingShape && resizeShapeHandle) {
    const esTexto = String(resizingShape).startsWith('texto_');
    const realId  = esTexto ? parseInt(resizingShape.split('_')[1]) : resizingShape;
    const obj     = esTexto ? textos.find(t => t.id == realId) : shapes.find(s => s.id == resizingShape);
    if (!obj) return;
    const dx = (e.clientX - resizeShapeStart.mx) / zoom;
    const dy = (e.clientY - resizeShapeStart.my) / zoom;
    if (resizeShapeHandle === 'br') { obj.w = Math.max(40, resizeShapeStart.w + dx); obj.h = Math.max(20, resizeShapeStart.h + dy); }
    if (resizeShapeHandle === 'bl') { obj.x = resizeShapeStart.x + dx; obj.w = Math.max(40, resizeShapeStart.w - dx); obj.h = Math.max(20, resizeShapeStart.h + dy); }
    if (resizeShapeHandle === 'tr') { obj.y = resizeShapeStart.y + dy; obj.w = Math.max(40, resizeShapeStart.w + dx); obj.h = Math.max(20, resizeShapeStart.h - dy); }
    if (resizeShapeHandle === 'tl') { obj.x = resizeShapeStart.x + dx; obj.y = resizeShapeStart.y + dy; obj.w = Math.max(40, resizeShapeStart.w - dx); obj.h = Math.max(20, resizeShapeStart.h - dy); }
    redrawAll();
    renderShapes();
    if (esTexto) renderTextos();
  }
  if (draggingTexto) {
    const t     = textos.find(t => t.id == draggingTexto);
    const layer = document.getElementById('textos-layer');
    const div   = layer?.querySelector(`[data-id="${draggingTexto}"]`);
    if (!t || !div) return;
    const newLeft = e.clientX - dragTextoOffset.x;
    const newTop  = e.clientY - dragTextoOffset.y;
    div.style.left = newLeft + 'px';
    div.style.top  = newTop  + 'px';
    t.x = (newLeft - panX) / zoom;
    t.y = (newTop  - panY) / zoom;
  }
});

// Zoom
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.1 : 0.9;
  const r  = canvas.getBoundingClientRect();
  const mx = e.clientX - r.left;
  const my = e.clientY - r.top;
  panX = mx - (mx - panX) * factor;
  panY = my - (my - panY) * factor;
  zoom = Math.min(5, Math.max(0.1, zoom * factor));
  document.getElementById('zoom-label').textContent = Math.round(zoom * 100) + '%';
  drawBg(); renderStrokes(); renderImages();
}, { passive: false });

// Spacebar pan
window.addEventListener('keydown', e => {
  if (e.code === 'Space' && !textActive) { canvas.style.cursor = 'grab'; }
  if (e.key === 'Delete' && selectedImg !== null) {
    images = images.filter(i => i.id !== selectedImg);
    selectedImg = null;
    renderImages();
    saveState();
  }
  if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
  if (e.ctrlKey && e.key === 'y') { e.preventDefault(); redo(); }
  if (e.code === 'Space' && !window._editandoTexto) { canvas.style.cursor = 'grab'; }
  if ((e.key === 'Delete' || e.key === 'Backspace') && selectedImg && !window._editandoTexto) {
    e.preventDefault();
    eliminarImagenSeleccionada();
  }
  if ((e.key === 'Delete' || e.key === 'Backspace') && !window._editandoTexto) {
    if (selectedImg)   { e.preventDefault(); eliminarImagenSeleccionada(); }
    if (selectedShape) { e.preventDefault(); eliminarShapeSeleccionada(); }
    if (selectedTexto) {
      e.preventDefault();
      saveState();
      textos = textos.filter(t => t.id !== selectedTexto);
      selectedTexto = null;
      renderTextos();
    }
  }
  if (!window._editandoTexto && shortcuts[e.key.toLowerCase()]) setTool(shortcuts[e.key.toLowerCase()]);
  if (e.key === 'Escape' && textActive) commitText();
  // Tool shortcuts
  const shortcuts = { p:'pencil', e:'eraser', f:'fill', l:'line', r:'rect', c:'circle', t:'triangle', a:'arrow', x:'text', s:'select' };
  if (!textActive && shortcuts[e.key.toLowerCase()]) setTool(shortcuts[e.key.toLowerCase()]);
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space') canvas.style.cursor = tool === 'pan' ? 'grab' : 'crosshair';
});

textInput.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); commitText(); }
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commitText(); }
});

function getCanvasPos(e) {
  const r = canvas.getBoundingClientRect();
  return screenToCanvas(e.clientX - r.left, e.clientY - r.top);
}

function setTool(t) {
  tool = t;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.toggle('active', b.dataset.tool === t));
  canvas.style.cursor = t === 'pan' ? 'grab' : t === 'eraser' ? 'cell' : t === 'fill' ? 'crosshair' : t === 'select' ? 'default' : 'crosshair';
  document.getElementById('section-text-props').style.display = t === 'text' ? '' : 'none';
  document.getElementById('section-fill').style.display = ['rect','circle','triangle'].includes(t) ? '' : 'none';

  // Con texto activo, el canvas debe recibir clicks, no las imágenes
  document.querySelectorAll('.img-obj').forEach(el => {
    el.style.pointerEvents = t === 'text' ? 'none' : 'all';
  });

  // Poner canvas-main encima cuando se necesita
  canvas.style.zIndex = t === 'text' ? '10' : '';
}

function buildPalette() {
  const grid = document.getElementById('color-grid');
  grid.innerHTML = '';
  COLORS.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch' + (c === strokeColor ? ' selected' : '');
    sw.style.background = c;
    sw.style.border = c === '#ffffff' ? '2px solid rgba(255,255,255,0.2)' : '';
    sw.onclick = () => { strokeColor = c; document.getElementById('color-custom').value = c; buildPalette(); };
    grid.appendChild(sw);
  });
}

document.getElementById('btn-save').addEventListener('click', () => {
  // Flatten: bg + drawing + images
  const out = document.createElement('canvas');
  out.width = canvas.width; out.height = canvas.height;
  const octx = out.getContext('2d');

  // BG
  if (bgMode !== 'transparent') octx.drawImage(canvasBg, 0, 0);

  // Drawing
  octx.drawImage(canvas, 0, 0);

  // Shapes
  const shapeCanvas = document.createElement('canvas');
  shapeCanvas.width = canvas.width; shapeCanvas.height = canvas.height;
  const sctx = shapeCanvas.getContext('2d');
  sctx.translate(panX, panY);
  sctx.scale(zoom, zoom);
  for (const s of shapes) {
    sctx.save();
    sctx.globalAlpha  = s.opacity;
    sctx.strokeStyle  = s.color;
    sctx.fillStyle    = s.fillColor ?? s.color;
    sctx.lineWidth    = s.size;
    sctx.lineCap      = 'round';
    const cx = (s.x ?? 0) + (s.w ?? 0) / 2;
    const cy = (s.y ?? 0) + (s.h ?? 0) / 2;
    sctx.translate(cx, cy);
    sctx.rotate((s.rotation ?? 0) * Math.PI / 180);
    sctx.translate(-cx, -cy);
    drawShapeObj(sctx, s);
    sctx.restore();
  }
  octx.drawImage(shapeCanvas, 0, 0);

  // Textos
  octx.save();
  octx.translate(panX, panY);
  octx.scale(zoom, zoom);
  for (const t of textos) {
    octx.save();
    octx.fillStyle = t.color;
    octx.font = `${t.italic?'italic ':''  }${t.bold?'bold ':''  }${t.fontSize}px 'Segoe UI',sans-serif`;
    const tcx = t.x + t.w / 2, tcy = t.y + t.h / 2;
    octx.translate(tcx, tcy);
    octx.rotate((t.rotation ?? 0) * Math.PI / 180);
    octx.translate(-tcx, -tcy);
    t.texto.split('\n').forEach((line, i) =>
      octx.fillText(line, t.x + 4, t.y + t.fontSize + i * t.fontSize * 1.3));
    octx.restore();
  }
  octx.restore();

  // Images
  images.forEach(img => {
    const el = new Image();
    el.src = img.src;
    octx.save();
    octx.translate(img.x * zoom + panX + img.w * zoom / 2, img.y * zoom + panY + img.h * zoom / 2);
    octx.rotate((img.rotation ?? 0) * Math.PI / 180);
    octx.drawImage(el, -img.w * zoom / 2, -img.h * zoom / 2, img.w * zoom, img.h * zoom);
    octx.restore();
  });

  const link = document.createElement('a');
  link.download = `atsukidraw_${Date.now()}.png`;
  link.href = out.toDataURL('image/png');
  link.click();
});

document.getElementById('btn-zoom-in').addEventListener('click',    () => { zoom = Math.min(5, zoom * 1.2); document.getElementById('zoom-label').textContent = Math.round(zoom*100)+'%'; drawBg(); renderImages(); });
document.getElementById('btn-zoom-out').addEventListener('click',   () => { zoom = Math.max(0.1, zoom / 1.2); document.getElementById('zoom-label').textContent = Math.round(zoom*100)+'%'; drawBg(); renderImages(); });
document.getElementById('btn-zoom-reset').addEventListener('click', () => { zoom = 1; panX = 0; panY = 0; document.getElementById('zoom-label').textContent = '100%'; drawBg(); renderImages(); });
document.getElementById('btn-back').addEventListener('click', () => window.chrome?.webview?.postMessage('navigate:nuevatab'));

// ═══════════════════════════════════════
//  THEME
// ═══════════════════════════════════════
window.chrome?.webview?.addEventListener('message', e => {
  const raw = e.data;
  if (typeof raw !== 'string') return;
  if (raw.startsWith('tema:')) {
    try {
      const t = JSON.parse(raw.slice(5));
      const r = document.documentElement;
      const hex = t.Accent ?? t.accent ?? '#7c3aed';
      r.style.setProperty('--accent', hex);
      r.style.setProperty('--bg', t.Bg ?? t.bg ?? '#0d0d14');
      r.style.setProperty('--surface', t.Surface ?? t.surface ?? '#13131f');
      r.style.setProperty('--surface2', t.Surface2 ?? t.surface2 ?? '#1a1a2e');
      const hx = hex.replace('#','');
      r.style.setProperty('--ar', parseInt(hx.slice(0,2),16));
      r.style.setProperty('--ag', parseInt(hx.slice(2,4),16));
      r.style.setProperty('--ab', parseInt(hx.slice(4,6),16));
    } catch {}
  }
});
window.chrome?.webview?.postMessage('get:tema');

// ═══════════════════════════════════════
//  MENÚ CONTEXTUAL
// ═══════════════════════════════════════
const ctxMenu = document.getElementById('ctx-menu');

function mostrarCtxMenu(x, y) {
  ctxMenu.style.left = x + 'px';
  ctxMenu.style.top  = y + 'px';
  // Ajustar si se sale de la pantalla
  ctxMenu.classList.add('open');
  const r = ctxMenu.getBoundingClientRect();
  if (r.right  > window.innerWidth)  ctxMenu.style.left = (x - r.width)  + 'px';
  if (r.bottom > window.innerHeight) ctxMenu.style.top  = (y - r.height) + 'px';
}

function cerrarCtxMenu() {
  ctxMenu.classList.remove('open');
}

// Abrir con click derecho en shapes
document.getElementById('shapes-layer').addEventListener('contextmenu', e => {
  e.preventDefault();
  const div = e.target.closest('.shape-obj');
  if (!div) return;
  selectedShape = parseInt(div.dataset.id) || div.dataset.id;
  selectedImg   = null;
  renderShapes(); renderImages();
  mostrarCtxMenu(e.clientX, e.clientY);
});

// Abrir con click derecho en imágenes
document.getElementById('images-layer').addEventListener('contextmenu', e => {
  e.preventDefault();
  const div = e.target.closest('.img-obj');
  if (!div) return;
  selectedImg   = parseInt(div.dataset.id) || div.dataset.id;
  selectedShape = null;
  renderShapes(); renderImages();
  mostrarCtxMenu(e.clientX, e.clientY);
});

// Cerrar al click fuera
document.addEventListener('mousedown', e => {
  if (!ctxMenu.contains(e.target)) cerrarCtxMenu();
});

// Acciones
ctxMenu.querySelectorAll('.ctx-item').forEach(item => {
  item.addEventListener('click', () => {
    const action = item.dataset.action;
    ejecutarAccionCtx(action);
    cerrarCtxMenu();
  });
});

function ejecutarAccionCtx(action) {
  // Determinar si es shape o imagen
  const esShape = selectedShape !== null;
  const esImg   = selectedImg   !== null;
  const esTexto = selectedTexto !== null;
  if (!esShape && !esImg) return;

  // Arrays y funciones de render unificados
  const arr     = esTexto ? textos : esShape ? shapes : images;
  const id      = esTexto ? selectedTexto : esShape ? selectedShape : selectedImg;
  const idx     = arr.findIndex(o => o.id == id);
  if (esTexto) renderTextos();
  if (idx === -1) return;

  saveState();

  switch (action) {
    case 'frente':
      arr.push(arr.splice(idx, 1)[0]);
      break;

    case 'fondo':
      arr.unshift(arr.splice(idx, 1)[0]);
      break;

    case 'adelantar':
      if (idx < arr.length - 1) {
        [arr[idx], arr[idx + 1]] = [arr[idx + 1], arr[idx]];
      }
      break;

    case 'atrasar':
      if (idx > 0) {
        [arr[idx], arr[idx - 1]] = [arr[idx - 1], arr[idx]];
      }
      break;

    case 'duplicar': {
      const copia = JSON.parse(JSON.stringify(arr[idx]));
      copia.id  = Date.now();
      copia.x   = (copia.x ?? copia.x1 ?? 0) + 20;
      copia.y   = (copia.y ?? copia.y1 ?? 0) + 20;
      if (copia.x1 !== undefined) { copia.x1 += 20; copia.y1 += 20; copia.x2 += 20; copia.y2 += 20; }
      arr.splice(idx + 1, 0, copia);
      if (esShape) selectedShape = copia.id;
      else         selectedImg   = copia.id;
      break;
    }

    case 'eliminar':
      arr.splice(idx, 1);
      if (esShape) selectedShape = null;
      else         selectedImg   = null;
      break;
  }

  redrawAll();
  renderShapes();
  renderImages();
}

// ═══════════════════════════════════════
//  LAYOUTS
// ═══════════════════════════════════════
const LAYOUTS = ['default', 'mspaint', 'excalidraw', 'dark-pro'];

function aplicarLayout(layout) {
  // Quitar clases anteriores
  LAYOUTS.forEach(l => document.body.classList.remove('layout-' + l));
  if (layout !== 'default') document.body.classList.add('layout-' + layout);

  // Actualizar botones
  document.querySelectorAll('.layout-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.layout === layout);
  });

  // Sincronizar props-float con valores actuales en layout excalidraw
  if (layout === 'excalidraw') sincronizarPropsFloat();

  localStorage.setItem('draw_layout', layout);
}

function sincronizarPropsFloat() {
  const colores = document.getElementById('pf-colors');
  if (!colores || colores.children.length > 0) return;
  COLORS.forEach(c => {
    const dot = document.createElement('div');
    dot.style.cssText = `width:16px;height:16px;border-radius:50%;background:${c};cursor:pointer;
      border:2px solid ${c === strokeColor ? 'white' : 'transparent'};transition:border-color 0.15s;flex-shrink:0`;
    dot.addEventListener('click', () => {
      strokeColor = c;
      document.getElementById('color-preview').style.background = c;
      colores.querySelectorAll('div').forEach(d => d.style.borderColor = 'transparent');
      dot.style.borderColor = 'white';
    });
    colores.appendChild(dot);
  });

  document.getElementById('pf-size').addEventListener('input', e => {
    strokeWidth = parseInt(e.target.value);
    document.getElementById('size-slider').value = strokeWidth;
    document.getElementById('size-val').textContent = strokeWidth;
  });

  document.getElementById('pf-opacity').addEventListener('input', e => {
    opacity = parseInt(e.target.value) / 100;
    document.getElementById('opacity-slider').value = e.target.value;
    document.getElementById('opacity-val').textContent = e.target.value + '%';
  });
}

document.querySelectorAll('.layout-btn').forEach(btn => {
  btn.addEventListener('click', () => aplicarLayout(btn.dataset.layout));
});

// Cargar layout guardado
const savedLayout = localStorage.getItem('draw_layout') ?? 'default';
aplicarLayout(savedLayout);
