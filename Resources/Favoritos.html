<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<title>Favoritos</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --accent: #7c3aed;
    --bg: #0d0d14;
    --surface: #13131f;
    --surface2: #1a1a2e;
    --border: rgba(124,58,237,0.25);
    --text: rgba(255,255,255,0.85);
    --muted: rgba(255,255,255,0.35);
  }
    body {
    font-family: 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    }

    #main {
    flex: 1;
    padding: 40px;
    overflow-y: auto;
    }

    #main {
  padding: 40px 40px 40px 32px;
    }
  #header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
  #header h2 { font-size: 22px; font-weight: 300; color: white; letter-spacing: -0.5px; }
  #header h2 span { color: var(--accent); }
  #btn-limpiar {
    background: rgba(255,51,102,0.1); border: 1px solid var(--border);
    color: var(--accent); padding: 8px 16px; border-radius: 4px; cursor: pointer;
    font-size: 12px; font-family: 'Segoe UI', sans-serif; letter-spacing: 0.05em; transition: background 0.15s;
  }
  #btn-limpiar:hover { background: rgba(255,51,102,0.2); }

  #search-wrap {
    display: flex; align-items: center; background: var(--surface);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 0 16px; height: 40px; margin-bottom: 28px; position: relative;
  }
  #search-wrap::before {
    content: ''; position: absolute; left: 0; top: 0;
    width: 3px; height: 100%; background: var(--accent); border-radius: 4px 0 0 4px;
  }
  #search-favoritos {
    flex: 1; background: none; border: none; outline: none;
    color: white; font-size: 13px; font-family: 'Segoe UI', sans-serif; margin-left: 10px;
  }
  #search-favoritos::placeholder { color: var(--muted); }

  .fav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }

  .fav-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px; cursor: pointer;
    transition: all 0.15s; position: relative;
    display: flex; flex-direction: column; gap: 6px;
  }
  .fav-card:hover { border-color: rgba(255,51,102,0.4); box-shadow: 0 0 16px rgba(255,51,102,0.08); }

  .fav-card-title { font-size: 13px; color: var(--text); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fav-card-url { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fav-card-date { font-size: 10px; color: var(--muted); margin-top: 4px; }

  .fav-delete {
    position: absolute; top: 10px; right: 10px;
    background: rgba(255,51,102,0.15); border: none; color: var(--accent);
    width: 22px; height: 22px; border-radius: 4px; cursor: pointer;
    font-size: 13px; display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.15s;
  }
  .fav-card:hover .fav-delete { opacity: 1; }

  #empty { text-align: center; color: var(--muted); font-size: 14px; margin-top: 80px; }
  #empty p { margin-top: 8px; font-size: 12px; }
  body {
  display: flex;
}

#sidebar {
  width: 240px;
  min-width: 240px;
  height: 100vh;
  position: sticky;
  top: 0;
  background: #0a0a10;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

#sidebar-header {
  padding: 20px 16px 12px;
  border-bottom: 1px solid var(--border);
}

#accent-bar {
  width: 32px; height: 2px;
  background: var(--accent);
  border-radius: 2px;
  margin-bottom: 8px;
}

#sidebar-header h1 {
  font-size: 15px; font-weight: 700;
  color: white; letter-spacing: 0.05em;
  text-transform: uppercase;
}

#sidebar-header p {
  font-size: 11px; color: var(--muted);
  margin-top: 2px;
}

.sb-section {
  padding: 16px 8px 4px;
}

.sb-section-label {
  font-size: 10px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.12em;
  padding: 0 8px; margin-bottom: 4px;
}

.sb-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 6px;
  cursor: pointer; font-size: 13px; color: var(--muted);
  transition: all 0.15s; border: 1px solid transparent;
  text-decoration: none; position: relative;
}

.sb-item:hover {
  background: rgba(255,255,255,0.04);
  color: var(--text);
}

.sb-item.active {
  background: rgba(255,255,255,0.06);
  border-color: var(--border);
  color: white;
}

.sb-item.active::before {
  content: '';
  position: absolute; left: 0; top: 20%; bottom: 20%;
  width: 2px; border-radius: 2px;
  background: var(--accent);
}

.sb-icon {
  width: 18px; text-align: center;
  font-size: 14px; opacity: 0.7;
  flex-shrink: 0;
}

.sb-item.active .sb-icon { opacity: 1; }

#sidebar-footer {
  margin-top: auto;
  padding: 12px 16px;
  border-top: 1px solid var(--border);
}

#sidebar-footer p { font-size: 10px; color: var(--muted); }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <div id="accent-bar"></div>
    <h1>AtsukiBrowser</h1>
    <p id="sb-version">v1.0.0</p>
  </div>

  <div class="sb-section">
    <div class="sb-section-label">Herramientas</div>
    <a class="sb-item active" onclick="window.chrome.webview.postMessage('navigate:favoritos'); return false;" href="#">
      <span class="sb-icon">⭐</span> Favoritos
    </a>
    <a class="sb-item" onclick="window.chrome.webview.postMessage('navigate:historial'); return false;" href="#">
      <span class="sb-icon">🕐</span> Historial
    </a>
    <a class="sb-item" id="sb-perfiles" href="#">
      <span class="sb-icon">👤</span> Perfiles
    </a>
  </div>

  <div class="sb-section">
    <div class="sb-section-label">Ajustes</div>
    <a class="sb-item" onclick="window.chrome.webview.postMessage('navigate:ajustes'); return false;" href="#">
      <span class="sb-icon">🎨</span> Apariencia
    </a>
  </div>


  <div id="sidebar-footer">
    <p id="sb-footer-version">AtsukiBrowser · v1.0.0</p>
  </div>
</div>

<div id="main">
  <div id="header">
    <h2>Mis <span>favoritos</span></h2>
    <button id="btn-limpiar">Limpiar favoritos</button>
  </div>
  <div id="search-wrap">
    <span style="color:var(--muted);font-size:14px">🔍</span>
    <input id="search-favoritos" type="text" placeholder="Buscar en favoritos..." />
  </div>
  <div id="lista"></div>
</div>

<script>
  let entradas = [];

  function hexToRgba(hex, alpha) {
    hex = hex.replace('#','');
    const r = parseInt(hex.slice(0,2),16);
    const g = parseInt(hex.slice(2,4),16);
    const b = parseInt(hex.slice(4,6),16);
    return `rgba(${r},${g},${b},${alpha})`;
  }
  
  function aplicarTema(t) {
    const root = document.documentElement;
    root.style.setProperty('--accent',   t.Accent   ?? t.accent);
    root.style.setProperty('--bg',       t.Bg       ?? t.bg);
    root.style.setProperty('--surface',  t.Surface  ?? t.surface);
    root.style.setProperty('--surface2', t.Surface2 ?? t.surface2);
    root.style.setProperty('--border',   hexToRgba(t.Accent ?? t.accent, 0.25));
    if (t.Font ?? t.font)
        root.style.setProperty('--font', `'${t.Font ?? t.font}', sans-serif`);
  }  

  window.chrome.webview.addEventListener('message', e => {
    const raw = e.data;
    if (typeof raw === 'string' && raw.startsWith('favoritos:')) {
      entradas = JSON.parse(raw.slice('favoritos:'.length));
      renderizar(entradas);
    }
    if (typeof raw === 'string' && raw.startsWith('tema:')) {
      aplicarTema(JSON.parse(raw.slice('tema:'.length)));
    }
    if (typeof raw === 'string' && raw.startsWith('version:')) {
      const v = raw.slice('version:'.length);
      const el1 = document.getElementById('sb-version');
      const el2 = document.getElementById('sb-footer-version');
      if (el1) el1.textContent = 'v' + v;
      if (el2) el2.textContent = 'AtsukiBrowser · v' + v;
    }
  });

  function cargarFavoritos() {
    window.chrome.webview.postMessage('get:favoritos');
  }

  function renderizar(datos) {
    const lista = document.getElementById('lista');
    lista.innerHTML = '';

    if (datos.length === 0) {
      lista.innerHTML = '<div id="empty">⭐<p>No hay favoritos todavía.</p></div>';
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'fav-grid';

    datos.forEach(item => {
      const fecha = new Date(item.Fecha ?? item.fecha);
      const fechaStr = fecha.toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' });

      const card = document.createElement('div');
      card.className = 'fav-card';
      card.innerHTML = `
        <button class="fav-delete" title="Eliminar">×</button>
        <div class="fav-card-title">${item.Titulo ?? item.titulo ?? item.Url ?? item.url}</div>
        <div class="fav-card-url">${item.Url ?? item.url}</div>
        <div class="fav-card-date">${fechaStr}</div>
      `;

      const url = item.Url ?? item.url;

      card.addEventListener('click', () => {
        window.chrome.webview.postMessage('navigate:' + url);
      });

      card.querySelector('.fav-delete').addEventListener('click', ev => {
        ev.stopPropagation();
        window.chrome.webview.postMessage('favorito:quitar:' + url);
      });

      grid.appendChild(card);
    });

    lista.appendChild(grid);
  }

  document.getElementById('search-favoritos').addEventListener('input', function() {
    const q = this.value.toLowerCase();
    const filtrado = entradas.filter(e =>
      (e.Titulo ?? e.titulo ?? '').toLowerCase().includes(q) ||
      (e.Url ?? e.url ?? '').toLowerCase().includes(q)
    );
    renderizar(filtrado);
  });

  document.getElementById('btn-limpiar').addEventListener('click', () => {
    if (confirm('¿Limpiar todos los favoritos?')) {
      entradas = [];
      renderizar([]);
      window.chrome.webview.postMessage('favorito:quitar:todos');
    }
  });

  document.getElementById('sb-perfiles')?.addEventListener('click', e => {
    e.preventDefault();
    window.chrome.webview.postMessage('perfiles');
  });

  window.chrome.webview.postMessage('get:tema');
  cargarFavoritos();
</script>
</body>
</html>
