<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<title>Extensiones</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --accent: #7c3aed;
    --bg: #0d0d14;
    --surface: #13131f;
    --surface2: #1a1a2e;
    --border: rgba(124,58,237,0.2);
    --text: rgba(255,255,255,0.85);
    --muted: rgba(255,255,255,0.35);
  }
  body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  #main { max-width: 860px; padding: 40px; }

  #header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
  #header h2 { font-size: 22px; font-weight: 300; color: white; }
  #header h2 span { color: var(--accent); }
  .header-btns { display: flex; gap: 10px; }

  .btn {
    background: rgba(124,58,237,0.1); border: 1px solid var(--border);
    color: var(--accent); padding: 8px 16px; border-radius: 4px; cursor: pointer;
    font-size: 12px; font-family: 'Segoe UI', sans-serif; letter-spacing: 0.05em;
    transition: background 0.15s;
  }
  .btn:hover { background: rgba(124,58,237,0.2); }
  .btn-chrome { color: #60a5fa; border-color: rgba(96,165,250,0.25); background: rgba(96,165,250,0.07); }
  .btn-chrome:hover { background: rgba(96,165,250,0.15); }

  .section-label {
    font-size: 10px; color: var(--accent); text-transform: uppercase;
    letter-spacing: 0.1em; margin-bottom: 14px; padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .ext-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 32px; }

  .ext-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 20px;
    display: flex; align-items: center; gap: 16px;
    transition: border-color 0.15s;
  }
  .ext-card:hover { border-color: rgba(124,58,237,0.4); }
  .ext-card.inactiva { opacity: 0.5; }

  .ext-icon {
    width: 44px; height: 44px; border-radius: 10px;
    background: var(--surface2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }
  .ext-icon.chrome { background: rgba(96,165,250,0.08); border-color: rgba(96,165,250,0.2); }

  .ext-info { flex: 1; overflow: hidden; }
  .ext-nombre { font-size: 14px; color: white; font-weight: 500; }
  .ext-desc { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .ext-meta { display: flex; gap: 8px; margin-top: 6px; align-items: center; }
  .ext-badge {
    font-size: 9px; padding: 2px 7px; border-radius: 4px;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .badge-atsuki { background: rgba(124,58,237,0.15); color: var(--accent); }
  .badge-chrome { background: rgba(96,165,250,0.12); color: #60a5fa; }
  .ext-version { font-size: 10px; color: var(--muted); }

  .ext-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

  /* Toggle switch */
  .toggle { position: relative; width: 40px; height: 22px; cursor: pointer; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-track {
    position: absolute; inset: 0;
    background: rgba(255,255,255,0.08); border-radius: 22px;
    transition: background 0.2s;
  }
  .toggle input:checked + .toggle-track { background: var(--accent); }
  .toggle-thumb {
    position: absolute; top: 3px; left: 3px;
    width: 16px; height: 16px; border-radius: 50%;
    background: white; transition: transform 0.2s;
  }
  .toggle input:checked ~ .toggle-thumb { transform: translateX(18px); }

  .btn-desinstalar {
    background: transparent; border: 1px solid rgba(255,255,255,0.08);
    color: var(--muted); padding: 5px 10px; border-radius: 4px;
    cursor: pointer; font-size: 11px; font-family: 'Segoe UI', sans-serif;
    transition: all 0.15s;
  }
  .btn-desinstalar:hover { border-color: rgba(239,68,68,0.4); color: #ef4444; }

  #empty { text-align: center; color: var(--muted); font-size: 14px; margin-top: 40px; }
  #empty p { margin-top: 8px; font-size: 12px; }

  .info-box {
    background: rgba(96,165,250,0.06); border: 1px solid rgba(96,165,250,0.15);
    border-radius: 8px; padding: 14px 16px; margin-bottom: 24px;
    font-size: 12px; color: rgba(255,255,255,0.45); line-height: 1.6;
  }
  .info-box strong { color: #60a5fa; }

  .btn-exportar {
      background: transparent; border: 1px solid rgba(255,255,255,0.08);
      color: var(--muted); padding: 5px 10px; border-radius: 4px;
      cursor: pointer; font-size: 11px; font-family: 'Segoe UI', sans-serif;
      transition: all 0.15s;
  }
  .btn-exportar:hover { border-color: rgba(124,58,237,0.4); color: var(--accent); }
</style>
</head>
<body>
<div id="main">
  <div id="header">
    <h2>Mis <span>extensiones</span></h2>
    <div class="header-btns">
      <button class="btn" id="btn-instalar-atsuki">+ Instalar .atsuki</button>
      <button class="btn btn-chrome" id="btn-instalar-chrome">+ Instalar Chrome/Edge</button>
    </div>
  </div>

  <div class="info-box">
    <strong>Extensiones .atsuki</strong> — scripts propios de AtsukiBrowser que se inyectan en todas las páginas.<br>
    <strong>Chrome/Edge</strong> — extensiones desempaquetadas (carpeta con manifest.json). Instala desde la carpeta de la extensión descomprimida.
  </div>

  <div class="section-label">Extensiones instaladas</div>
  <div class="ext-grid" id="lista"></div>
</div>

<script>
  let extensiones = [];

  window.chrome.webview.addEventListener('message', e => {
    const raw = e.data;
    if (typeof raw === 'string' && raw.startsWith('extensiones:')) {
      extensiones = JSON.parse(raw.slice('extensiones:'.length));
      renderizar();
    }
    // Aplicar tema si llega
    if (typeof raw === 'string' && raw.startsWith('tema:')) {
      const t = JSON.parse(raw.slice('tema:'.length));
      document.documentElement.style.setProperty('--accent', t.Accent);
      document.documentElement.style.setProperty('--bg', t.Bg);
      document.documentElement.style.setProperty('--surface', t.Surface);
      document.documentElement.style.setProperty('--surface2', t.Surface2);
      document.documentElement.style.setProperty('--border', `rgba(${hexToRgb(t.Accent)},0.2)`);
    }
  });

  function hexToRgb(hex) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return `${r},${g},${b}`;
  }

  function renderizar() {
    const lista = document.getElementById('lista');
    lista.innerHTML = '';

    if (extensiones.length === 0) {
      lista.innerHTML = '<div id="empty">🧩<p>No hay extensiones instaladas.</p></div>';
      return;
    }

    extensiones.forEach(ext => {
      const card = document.createElement('div');
      card.className = 'ext-card' + (ext.Activa ? '' : ' inactiva');

      const esChrome = ext.Tipo === 'chrome';
      const icono = esChrome ? '🌐' : (ext.Icono || '🧩');
      const iconoHtml = (!esChrome && ext.IconoData)
          ? `<img src="${ext.IconoData}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;"/>`
          : icono;

      card.innerHTML = `
        <div class="ext-icon ${esChrome ? 'chrome' : ''}">${iconoHtml}</div>
        <div class="ext-info">
          <div class="ext-nombre">${ext.Nombre || ext.Id}</div>
          <div class="ext-desc">${ext.Descripcion || ''}</div>
          <div class="ext-meta">
            <span class="ext-badge ${esChrome ? 'badge-chrome' : 'badge-atsuki'}">
              ${esChrome ? 'Chrome/Edge' : 'Atsuki'}
            </span>
            <span class="ext-version">v${ext.Version || '1.0'}</span>
          </div>
        </div>
        <div class="ext-actions">
          <label class="toggle">
            <input type="checkbox" ${ext.Activa ? 'checked' : ''}
              onchange="toggleExt('${ext.Id}', this.checked)"/>
            <div class="toggle-track"></div>
            <div class="toggle-thumb"></div>
          </label>
          ${!esChrome ? `
              <button class="btn-exportar"
                onclick="exportar('${ext.Id}')">Exportar</button>
          ` : ''}
          ${ext.Id !== 'adblock' ? `
              <button class="btn-desinstalar"
                onclick="desinstalar('${ext.Id}')">Desinstalar</button>
          ` : ''}
        </div>
      `;

      lista.appendChild(card);
    });
  }

  function toggleExt(id, activa) {
    window.chrome.webview.postMessage(`extension:toggle:${id}:${activa}`);
  }

  function desinstalar(id) {
    if (confirm('¿Desinstalar esta extensión?'))
      window.chrome.webview.postMessage('extension:desinstalar:' + id);
  }

  function exportar(id) {
      window.chrome.webview.postMessage('extension:exportar:' + id);
  }

  document.getElementById('btn-instalar-atsuki').addEventListener('click', () => {
    window.chrome.webview.postMessage('extension:instalar:atsuki');
  });

  document.getElementById('btn-instalar-chrome').addEventListener('click', () => {
    window.chrome.webview.postMessage('extension:instalar:chrome');
  });

  window.chrome.webview.postMessage('get:extensiones');
</script>
</body>
</html>
