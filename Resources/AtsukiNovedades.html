<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<title>Novedades</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --accent: #7c3aed;
  --accent2: #a78bfa;
  --bg: #0d0d14;
  --surface: #13131f;
  --surface2: #1a1a2e;
  --border: rgba(124,58,237,0.2);
  --text: rgba(255,255,255,0.85);
  --muted: rgba(255,255,255,0.35);
}
body {
  font-family: 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
}

#card {
  max-width: 600px;
  width: 100%;
}

#badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 20px;
  background: rgba(124,58,237,0.15);
  border: 1px solid rgba(124,58,237,0.3);
  color: var(--accent2);
}
#badge.preview {
  background: rgba(251,191,36,0.1);
  border-color: rgba(251,191,36,0.3);
  color: #fbbf24;
}

h1 {
  font-size: 36px;
  font-weight: 200;
  color: white;
  margin-bottom: 8px;
  line-height: 1.2;
}
h1 span { color: var(--accent2); }

#version-tag {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 40px;
  font-family: 'Consolas', monospace;
}

#notas-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 28px 32px;
  margin-bottom: 32px;
  line-height: 1.8;
  font-size: 14px;
  color: var(--text);
  min-height: 100px;
  white-space: pre-wrap;
}

#notas-wrap.loading {
  color: var(--muted);
  font-style: italic;
}

#footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

#footer-text {
  font-size: 12px;
  color: var(--muted);
}

.footer-btn {
  background: rgba(124,58,237,0.1);
  border: 1px solid var(--border);
  color: var(--accent2);
  padding: 0 20px;
  height: 36px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 12px;
  font-family: 'Segoe UI', sans-serif;
  transition: all 0.15s;
  display: flex; align-items: center; gap: 8px;
}
.footer-btn:hover { background: rgba(124,58,237,0.22); }
.footer-btn.primary {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
.footer-btn.primary:hover { background: #6d28d9; }

/* Decoración de fondo */
#bg-glow {
  position: fixed;
  top: -100px; left: 50%;
  transform: translateX(-50%);
  width: 600px; height: 400px;
  background: radial-gradient(ellipse, rgba(124,58,237,0.08) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}
#card { position: relative; z-index: 1; }
</style>
</head>
<body>
<div id="bg-glow"></div>

<div id="card">
  <div id="badge">✦ AtsukiBrowser</div>
  <h1>Qué hay de <span>nuevo</span></h1>
  <div id="version-tag">Cargando...</div>

  <div id="notas-wrap" class="loading">Cargando notas de la versión...</div>

  <div id="footer">
    <span id="footer-text"></span>
    <div style="display:flex;gap:8px">
      <button class="footer-btn" id="btn-ajustes">⚙ Ajustes</button>
      <button class="footer-btn primary" id="btn-cerrar">Empezar →</button>
    </div>
  </div>
</div>

<script>
function aplicarTema(t) {
  const r = document.documentElement;
  const hex = t.Accent ?? t.accent ?? '#7c3aed';
  r.style.setProperty('--accent', hex);
  r.style.setProperty('--bg',      t.Bg      ?? t.bg      ?? '#0d0d14');
  r.style.setProperty('--surface', t.Surface ?? t.surface ?? '#13131f');
  r.style.setProperty('--surface2',t.Surface2 ?? t.surface2 ?? '#1a1a2e');
  const hx = hex.replace('#','');
  const rr = parseInt(hx.slice(0,2),16);
  const gg = parseInt(hx.slice(2,4),16);
  const bb = parseInt(hx.slice(4,6),16);
  r.style.setProperty('--border', `rgba(${rr},${gg},${bb},0.2)`);
  r.style.setProperty('--accent2', hex);
  document.getElementById('bg-glow').style.background =
    `radial-gradient(ellipse, rgba(${rr},${gg},${bb},0.08) 0%, transparent 70%)`;
}

// Función que llama C# con los datos
window.chrome?.webview?.addEventListener('message', e => {
  const raw = e.data;
  if (typeof raw !== 'string') return;

  if (raw.startsWith('tema:')) {
    aplicarTema(JSON.parse(raw.slice('tema:'.length)));
    return;
  }

  if (raw.startsWith('novedades:')) {
    const data = JSON.parse(raw.slice('novedades:'.length));
    const badge = document.getElementById('badge');
    if (data.esPreview) {
      badge.textContent = '⚠ Preview — puede ser inestable';
      badge.classList.add('preview');
    } else {
      badge.textContent = '✦ AtsukiBrowser';
    }
    document.getElementById('version-tag').textContent = `v${data.version}`;
    const notas = document.getElementById('notas-wrap');
    notas.classList.remove('loading');
    if (data.notas && data.notas.trim()) {
      notas.textContent = data.notas;
    } else {
      notas.textContent = 'No hay notas disponibles para esta versión.';
      notas.style.color = 'var(--muted)';
    }
    document.getElementById('footer-text').textContent =
      data.esPreview ? 'Estás en el canal preview.' : 'Gracias por actualizar AtsukiBrowser.';
  }
});

window.chrome?.webview?.addEventListener('message', e => {
  const raw = e.data;
  if (typeof raw !== 'string') return;
  if (raw.startsWith('tema:')) aplicarTema(JSON.parse(raw.slice('tema:'.length)));
});

document.getElementById('btn-cerrar').addEventListener('click', () =>
  window.chrome.webview.postMessage('navigate:nuevatab'));

document.getElementById('btn-ajustes').addEventListener('click', () =>
  window.chrome.webview.postMessage('navigate:ajustes'));

window.chrome?.webview?.postMessage('get:tema');

// Pedir datos cuando la página esté lista
window.chrome?.webview?.postMessage('get:novedades');
</script>
</body>
</html>
